  // E2: once in a while an idle adult strolls over to sit near the chick and
  // watch it. Never more than two at a time, never right on top of it, and
  // each one only tries again after a long pause — company, not a crowd.
  function maybeVisitChick(p, elapsed) {
    var c = chickEntity;
    if (!c || p === c || p.isChick || youth(c) === 2 || c.fleeing || elapsed < p.visitAfter) return false;
    if (c.state === "fly" || (c.practice && c.practice.type === "learnfly")) return false;
    if (Math.random() > 0.15) return false;
    var cx = c.root.position.x, cz = c.root.position.z;
    var d = Math.hypot(p.root.position.x - cx, p.root.position.z - cz);
    if (d > 12 || d < 2.2) return false;
    var company = 0;
    puffins.forEach(function (q) { if (q.visiting || q.watchT > 0) company++; });
    if (company >= 2) return false;
    var base = Math.atan2(p.root.position.z - cz, p.root.position.x - cx);
    for (var i = 0; i < 4; i++) {
      var a = base + (Math.random() - 0.5) * 1.6, r = 1.5 + Math.random() * 0.6;
      var tx = cx + Math.cos(a) * r, tz = cz + Math.sin(a) * r;
      if (!isSafeGround(tx, tz, 0.2)) continue;
      var taken = puffins.some(function (q) { return q !== p && Math.hypot(q.root.position.x - tx, q.root.position.z - tz) < 0.8; });
      if (taken) continue;
      p.target.set(tx, tz);
      p.visiting = true;
      p.state = "walk";
      p.visitAfter = elapsed + 60 + Math.random() * 40;
      return true;
    }
    p.visitAfter = elapsed + 20;
    return false;
  }

  function updatePuffins(dt, windFactor, elapsed) {
    for (var i = 0; i < puffins.length; i++) {
      var p = puffins[i];
      var pp = persona(p);
      var yth = youth(p);           // 0 chick, 1 juvenile, 2 adult
      if (p.isChick) updateChickLook(p, dt);
      var sz = p.sizeNow || 1;
      var wingFlap = 0;
      // pose offsets layered on top of each state's own motion — recomputed
      // every frame, so an interrupted reaction can never leave a stuck pose
      var leanX = 0, headX = 0, headZ = 0;
      p.startle = Math.max(0, p.startle - dt * 2.2);
      p.practiceRoll = 0;

      if (p.state === "spin") {
        p.spinT += dt;
        var sp = Math.min(p.spinT / p.spinDur, 1);
        var arc = Math.sin(sp * Math.PI) * 1.1 * sz;
        var bulge = Math.sin(sp * Math.PI); // 0 -> 1 -> 0
        p.root.position.y = groundHeight(p.root.position.x, p.root.position.z) + arc;
        p.root.rotation.y += dt * (Math.PI * 2.6);
        p.root.rotation.x = Math.sin(sp * Math.PI * 2) * 0.5;
        var scale = 1 + bulge * 0.35;
        p.root.scale.setScalar(scale);
        if (sp >= 1) {
          p.state = "idle";
          p.idleT = idleFor(p, 0.5, 1.2);
          p.root.position.y = groundHeight(p.root.position.x, p.root.position.z);
          p.root.rotation.x = 0;
          p.root.scale.setScalar(1);
        }
        continue;
      }

      if (p.state === "idle") {
        var lively = p.rec.personality === "lively";
        var calm = p.rec.personality === "easygoing";
        p.bob.position.y = Math.sin(elapsed * (calm ? 1.4 : 2.2) + p.bobPhase) * (lively ? 0.02 : 0.012);
        p.bob.rotation.z *= Math.max(0, 1 - dt * 8);
        wingFlap = Math.sin(elapsed * 1.4 + p.bobPhase) * 0.05;
        if (lively) {
          headZ = Math.sin(elapsed * 2.3 + p.bobPhase) * 0.12;
          if (Math.sin(elapsed * 0.9 + p.bobPhase * 3) > 0.93) wingFlap = Math.sin(elapsed * 24) * 0.45; // a little wing flick now and then
        }
        if (yth === 0 && Math.sin(elapsed * 0.8 + p.bobPhase * 2) > 0.94) {
          // a chick's spontaneous little flutter-and-bounce
          wingFlap = Math.sin(elapsed * 26) * 0.75;
          p.bob.position.y += Math.abs(Math.sin(elapsed * 13)) * 0.03;
        } else if (yth === 1 && Math.sin(elapsed * 0.6 + p.bobPhase) > 0.96) {
          wingFlap = 0.65; // a juvenile stretching its new wings
        }
        if (p.watchT > 0 && chickEntity) {
          // sitting near the chick, quietly watching it
          p.watchT -= dt;
          faceToward(p.root, chickEntity.root.position.x - p.root.position.x, chickEntity.root.position.z - p.root.position.z, dt, 2);
          headX -= 0.08;
          headZ = Math.sin(elapsed * 0.7 + p.bobPhase) * 0.08;
        }
        p.idleT -= dt;
        if (p.idleT <= 0) {
          p.watchT = 0;
          var sleepChance = yth === 0 ? Math.min(0.9, pp.sleepChance * 1.25) : pp.sleepChance;
          if (dayNight.current > 0.6 && Math.random() < sleepChance) {
            p.state = "sleep";
            p.sleepT = (6 + Math.random() * 10) * pp.sleepLen;
          } else if (!maybeVisitChick(p, elapsed)) {
            pickWanderTarget(p);
            p.state = "walk";
          }
        }
        if (p.state === "idle") {
          // E3: a visiting fox or owl nearby gets watched; if the fox comes
          // too close, the puffin just walks a few steps off
          var seen = visitorNear(p.root.position.x, p.root.position.z, 7);
          if (seen) {
            faceToward(p.root, seen.x - p.root.position.x, seen.z - p.root.position.z, dt, 3);
            headX -= 0.06;
            if (seen.kind === "fox" && seen.d < 2.3) stepAwayFrom(p, seen.x, seen.z);
          }
        }
      } else if (p.state === "sleep") {
        p.bob.position.y = 0;
        p.bob.rotation.z *= Math.max(0, 1 - dt * 8);
        p.sleepT -= dt;
        if (p.stirT > 0) {
          p.stirT = Math.max(0, p.stirT - dt);
          var stir = Math.sin(Math.PI * (1 - p.stirT / 1.2));
          headX -= 0.5 * stir;
          wingFlap = Math.sin(elapsed * 10) * 0.3 * stir;
        }
        if (p.sleepT <= 0 || dayNight.current < 0.3) {
          p.state = "idle";
          p.idleT = idleFor(p, 0.5, 1.4);
        }
      } else if (p.state === "react") {
        var r = p.react;
        p.reactT += dt;
        var k = Math.min(1, p.reactT / r.dur);
        var env = Math.sin(Math.PI * k);
        var gy = groundHeight(p.root.position.x, p.root.position.z);
        p.bob.rotation.z *= Math.max(0, 1 - dt * 8);
        // turn toward the viewer (yaw only, so it never tips over)
        faceToward(p.root, camera.position.x - p.root.position.x, camera.position.z - p.root.position.z, dt, 6);
        p.root.position.y = gy;
        p.bob.position.y = 0;
        if (r.type === "shy") {
          // flinch and duck first, then peek up at you — softer as it relaxes
          var soft = 1 - 0.7 * timidRelax(p);
          var flinch = k < 0.35 ? Math.sin(Math.PI * k / 0.35) : 0;
          leanX -= 0.35 * flinch * soft;
          headX += 0.3 * flinch * soft;
          if (k >= 0.35) { headZ = Math.sin(p.reactT * 6) * 0.12 * env; headX -= 0.12 * env; }
        } else if (r.type === "look") {
          headZ = Math.sin(p.reactT * 6) * 0.16 * env * r.amp;
          headX -= 0.15 * env;
          p.bob.position.y = Math.abs(Math.sin(p.reactT * 5)) * 0.02 * env * r.amp;
        } else if (r.type === "flap") {
          wingFlap = Math.sin(p.reactT * 18) * 0.8 * env * Math.min(1.2, r.amp);
          headX -= 0.2 * env;
          p.bob.position.y = Math.abs(Math.sin(p.reactT * 9)) * 0.04 * env * r.amp;
        } else { // joy: little hops with wings going
          p.root.position.y = gy + Math.abs(Math.sin(p.reactT * 7.5)) * 0.32 * env * r.amp * sz;
          wingFlap = Math.sin(p.reactT * 20) * 0.9 * env;
          headX -= 0.25 * env;
          p.bob.rotation.z = Math.sin(p.reactT * 7.5) * 0.14 * env;
        }
        if (k >= 1) finishReact(p);
      } else if (p.state === "practice") {
        var pr = p.practice;
        pr.t += dt;
        p.bob.position.y = 0;
        p.bob.rotation.z *= Math.max(0, 1 - dt * 8);
        if (pr.type === "flutter") {
          // three beats of frantic flapping, each lifting it a hair off the snow
          var beat = pr.t % 1.0;
          var burst = beat < 0.7 ? Math.sin(Math.PI * beat / 0.7) : 0;
          wingFlap = Math.sin(pr.t * 26) * 0.9 * burst;
          p.root.position.y = groundHeight(p.root.position.x, p.root.position.z) + burst * 0.16 * sz;
          headX -= 0.22 * burst;
          leanX -= 0.08 * burst;
        } else {
          faceToward(p.root, Math.sin(pr.heading), Math.cos(pr.heading), dt, 8);
          if (pr.t < pr.runDur) {
            // run-up: quick steps, wings starting to beat
            var kr = pr.t / pr.runDur;
            var rx = THREE.MathUtils.lerp(pr.start.x, pr.runEnd.x, kr * kr);
            var rz = THREE.MathUtils.lerp(pr.start.y, pr.runEnd.y, kr * kr);
            p.root.position.set(rx, groundHeight(rx, rz), rz);
            p.bob.position.y = Math.abs(Math.sin(pr.t * 22)) * 0.03;
            p.bob.rotation.z = Math.sin(pr.t * 22) * 0.12;
            wingFlap = Math.sin(pr.t * 22) * 0.6 * kr;
            leanX += 0.15 * kr;
          } else if (pr.t < pr.runDur + pr.airDur) {
            // low flight; wobbly at first, steadier with every completed flight
            var ka = (pr.t - pr.runDur) / pr.airDur;
            var e = ka < 0.5 ? 2 * ka * ka : 1 - Math.pow(-2 * ka + 2, 2) / 2;
            var ax = THREE.MathUtils.lerp(pr.runEnd.x, pr.land.x, e);
            var az = THREE.MathUtils.lerp(pr.runEnd.y, pr.land.y, e);
            var lift = Math.sin(Math.PI * ka);
            p.root.position.set(ax, groundHeight(ax, az) + 0.05 + lift * pr.arc + Math.sin(pr.t * 7) * pr.wobble * 0.3 * lift, az);
            p.practiceRoll = Math.sin(pr.t * 9) * pr.wobble;
            wingFlap = Math.sin(pr.t * 24) * 0.95;
            leanX += 0.2;
          } else {
            // touchdown: a little stumble, smaller once it knows how
            var kl = Math.min(1, (pr.t - pr.runDur - pr.airDur) / pr.landDur);
            p.root.position.set(pr.land.x, groundHeight(pr.land.x, pr.land.y), pr.land.y);
            leanX += Math.sin(Math.PI * kl) * (0.12 + pr.wobble * 0.6);
            wingFlap = Math.sin(pr.t * 14) * 0.45 * (1 - kl);
          }
        }
        if (pr.t >= pr.dur) completePractice(p);
      } else if (p.state === "walk") {
        var pos2 = new THREE.Vector2(p.root.position.x, p.root.position.z);
        var dir = new THREE.Vector2().subVectors(p.target, pos2);
        var dist = dir.length();
        if (dist < 0.12) {
          if (p.foodRef) {
            if (p.foodRef.active) {
              p.foodRef.active = false;
              consumeFood(p.foodRef);
              puffinAte(p, p.foodRef);
            }
            p.foodRef = null;
          }
          if (p.scurry) { p.scurry = false; p.fleeing = false; }
          p.state = "idle";
          p.idleT = idleFor(p, 1.2, 2.2);
          if (p.visiting) {
            p.visiting = false;
            p.watchT = 4 + Math.random() * 4;
            p.idleT = p.watchT + 0.5;
          }
        } else {
          dir.normalize();
          var avoid = steerAroundMountains(p.root.position.x, p.root.position.z, dir);
          if (avoid) {
            dir.x += avoid.x * 1.5;
            dir.y += avoid.y * 1.5;
            if (dir.lengthSq() > 0.0001) { dir.normalize(); } else { dir.set(1, 0); }
          }
          // short legs walk slower; a fleeing chick scurries as fast as it can
          var legs = yth === 0 ? 0.55 : yth === 1 ? 0.8 : 1;
          if (p.scurry) legs = yth === 0 ? 2.8 : 3.2;
          var mv = WALK_SPEED * pp.walk * legs * (0.85 + windFactor * 0.25) * dt;
          var stepPos = pushOutOfMountains(new THREE.Vector2(p.root.position.x + dir.x * mv, p.root.position.z + dir.y * mv));
          var nx = stepPos.x, nz = stepPos.y;
          p.root.position.x = nx; p.root.position.z = nz;
          p.root.position.y = groundHeight(nx, nz);
          faceToward(p.root, dir.x, dir.y, dt, 6);
          var gait = 9 * pp.walk * (yth === 0 ? 1.65 : yth === 1 ? 1.2 : 1) * (p.scurry ? 1.4 : 1);
          p.bob.rotation.z = Math.sin(elapsed * gait) * (yth === 0 ? 0.16 : 0.12);
          p.bob.position.y = Math.abs(Math.sin(elapsed * gait)) * (yth === 0 ? 0.02 : 0.025);
          wingFlap = p.scurry ? Math.sin(elapsed * 20) * (yth === 0 ? 0.45 : 0.7) : Math.sin(elapsed * 6) * 0.08;
        }
      } else if (p.state === "fly") {
        p.flightT += dt;
        var fp = Math.min(p.flightT / p.flightDuration, 1);
        var x = THREE.MathUtils.lerp(p.flightStart.x, p.target.x, fp);
        var z = THREE.MathUtils.lerp(p.flightStart.y, p.target.y, fp);
        var arcH = Math.sin(fp * Math.PI) * (p.flightArc || 2.4);
        p.root.position.set(x, groundHeight(x, z) + (yth === 1 ? 0.15 : 0.5) + arcH, z);
        var ddx = p.target.x - p.flightStart.x, ddz = p.target.y - p.flightStart.y;
        faceToward(p.root, ddx, ddz, dt, 10);
        if (yth === 1) {
          var wob = 0.28 * (1 - flightSkill(p)) + 0.06;
          p.root.rotation.z = Math.sin(elapsed * 9) * wob;
          wingFlap = Math.sin(elapsed * 26) * 0.95;
        } else {
          p.root.rotation.z = Math.sin(elapsed * 3) * 0.12;
          wingFlap = Math.sin(elapsed * 22) * 0.85;
        }
        if (fp >= 1) {
          p.root.position.y = groundHeight(p.target.x, p.target.y);
          p.root.rotation.z = 0;
          p.fleeing = false;
          if (p.foodRef) {
            if (p.foodRef.active) {
              p.foodRef.active = false;
              consumeFood(p.foodRef);
              puffinAte(p, p.foodRef);
            }
            p.foodRef = null;
          }
          p.state = "idle";
          p.idleT = idleFor(p, 0.8, 1.6);
        }
      }

      // ease the resting pose in/out regardless of which state we're in, so
      // waking up blends smoothly back into whatever it does next. The body
      // only hunkers down (squash from the feet up) and the head bows — no
      // vertical offset, so nothing ever dips below the snow
      var sleepTarget = p.state === "sleep" ? 1 : 0;
      p.sleepAmt = THREE.MathUtils.lerp(p.sleepAmt, sleepTarget, Math.min(1, dt * 2.2));
      p.bob.rotation.x = p.sleepAmt * 0.18 + leanX - p.startle * 0.32;
      p.bob.scale.y = 1 - p.sleepAmt * 0.14 + Math.sin(elapsed * 0.9 + p.bobPhase) * 0.012 * p.sleepAmt;
      p.headPivot.rotation.x = p.sleepAmt * 0.75 + headX;
      p.headPivot.rotation.z = headZ;
      wingFlap *= (1 - p.sleepAmt * (p.stirT > 0 ? 0.6 : 1));
      // practice-flight roll + timid shiver; normal flying owns root roll itself
      if (p.state !== "fly") {
        p.root.rotation.z = p.practiceRoll + (p.startle > 0.01 ? Math.sin(elapsed * 42) * 0.07 * p.startle : 0);
      }

      p.leftWingPivot.rotation.z = wingFlap;
      p.rightWingPivot.rotation.z = -wingFlap;
    }
  }

  function triggerSpin(index) {
    var p = puffins[index];
    // growth practice and escaping on foot take priority over a playful backflip
    if (!p || p.state === "spin" || p.state === "fly" || p.state === "practice" || p.fleeing) return;
    var wasAsleep = p.state === "sleep";
    p.state = "spin";
    p.spinT = 0;
    p.react = null;
    p.stirT = 0;
    // the spin branch skips the pose blend, so drop any resting pose up front
    p.sleepAmt = 0;
    p.bob.rotation.x = 0;
    p.bob.scale.y = 1;
    p.headPivot.rotation.x = 0;
    p.headPivot.rotation.z = 0;
    p.root.rotation.z = 0;
    showToast(t(wasAsleep ? "toast.puffinWoke" : "toast.puffinSpin"));
    // a sudden backflip right next to a timid neighbour makes it flinch
    for (var i = 0; i < puffins.length; i++) {
      var q = puffins[i];
      if (q !== p && q.root.position.distanceTo(p.root.position) < 3) startlePuffin(q, 0.8);
    }
  }

  // ===============================================================
  // 9. Feeding (click ground to drop food; puffins react by distance)
  // ===============================================================
  var foods = [];
  function spawnFood(x, z) {
    var g = new THREE.Group();
    var n = 3 + Math.floor(Math.random() * 2);
    for (var i = 0; i < n; i++) {
      var fish = new THREE.Mesh(
        new THREE.ConeGeometry(0.035, 0.12, 4),
        new THREE.MeshStandardMaterial({ color: "#8FB6C9", flatShading: true, metalness: 0.3, roughness: 0.4 })
      );
      var a = Math.random() * Math.PI * 2, r = Math.random() * 0.13;
      fish.position.set(Math.cos(a) * r, 0.06, Math.sin(a) * r);
      fish.rotation.z = Math.PI / 2;
      fish.rotation.y = Math.random() * Math.PI;
      fish.castShadow = true;
      g.add(fish);
    }
    var y = groundHeight(x, z);
    g.position.set(x, y, z);
    g.scale.setScalar(0.001);
    scene.add(g);

    var food = { group: g, pos: new THREE.Vector2(x, z), active: true, born: performance.now(), eaten: false, skipPopIn: false, byPlayer: true };
    foods.push(food);
    showToast(t("toast.foodLand"));
    for (var si = 0; si < puffins.length; si++) {
      var sp2 = puffins[si];
      var sd = Math.hypot(sp2.root.position.x - x, sp2.root.position.z - z);
      if (sd < 5) startlePuffin(sp2, 1 - sd / 6);
    }
    attractPuffinsToFood(food);
  }

  var PUFFIN_FOOD_RANGE = 38;

  function attractPuffinsToFood(food) {
    var x = food.pos.x, z = food.pos.y;
    var attracted = 0;
    var maxAttract = 8;
    function flatDist(p) { return Math.hypot(p.root.position.x - x, p.root.position.z - z); }
    // close companions answer first and from further away
    function priority(p) { return flatDist(p) * (stageOf(p.rec) === 2 ? 0.35 : 1); }
    function reach(p) {
      var yth = youth(p);
      // a chick only waddles a little way; a juvenile's foraging range grows with it
      if (yth === 0) return GROWTH.CHICK_FOOD_RANGE;
      if (yth === 1) return GROWTH.CHICK_FOOD_RANGE + (GROWTH.JUVENILE_FOOD_RANGE - GROWTH.CHICK_FOOD_RANGE) * stageProgress(p.rec.growth);
      return PUFFIN_FOOD_RANGE * persona(p).foodRange * (stageOf(p.rec) === 2 ? 1.3 : 1);
    }
    function available(p) { return (p.state === "idle" || p.state === "walk") && !p.fleeing; }

    // food dropped right next to a young bird is left for it — the adults are
    // far quicker and would otherwise never let it have a bite
    var young = chickEntity;
    if (young && youth(young) < 2 && available(young) && flatDist(young) <= GROWTH.RESERVE_RADIUS) {
      if (sendToFood(young, food, null)) return;
    }

    var order = puffins.map(function (_, idx) { return idx; });
    order.sort(function (ia, ib) { return priority(puffins[ia]) - priority(puffins[ib]); });
    for (var oi = 0; oi < order.length && attracted < maxAttract; oi++) {
      var p = puffins[order[oi]];
      if (!available(p)) continue;
      var d = flatDist(p);
      if (d > reach(p)) continue;
      // spread arrivals around the food in a small ring instead of stacking
      // everyone on the exact same point, which used to clip them into one mesh
      var ang = (attracted / maxAttract) * Math.PI * 2 + Math.random() * 0.5;
      var ringR = 0.22 + Math.random() * 0.1;
      if (sendToFood(p, food, { x: Math.cos(ang) * ringR, y: Math.sin(ang) * ringR })) attracted++;
    }
  }

  function consumeFood(food) {
    food.eaten = true;
  }

  function updateFood(dt) {
    var now = performance.now();
    for (var i = foods.length - 1; i >= 0; i--) {
      var f = foods[i];
      var age = (now - f.born) / 1000;
      if (!f.skipPopIn && age < 0.3) {
        var p = age / 0.3;
        f.group.scale.setScalar(1 - Math.pow(1 - p, 3));
      } else if (f.eaten || age > 22) {
        var fp = f._fadeP === undefined ? 0 : f._fadeP;
        fp += dt * 3;
        f._fadeP = fp;
        f.group.scale.setScalar(Math.max(0, 1 - fp));
        if (fp >= 1) {
          scene.remove(f.group);
          foods.splice(i, 1);
        }
      } else {
        f.group.scale.setScalar(1);
      }
    }
  }

  // ===============================================================
  // 9b. Fish — swim in ponds, jump ashore on click, become puffin food
  // ===============================================================
  var fishList = [];
  var fishClickTargets = [];

  function buildFishMesh() {
    var g = new THREE.Group();
    var body = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.07, 1),
      new THREE.MeshStandardMaterial({ color: "#8FC4D9", flatShading: true, roughness: 0.5, metalness: 0.15 })
    );
    body.scale.set(1, 0.75, 1.9);
    g.add(body);

    var belly = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.045, 0),
      new THREE.MeshStandardMaterial({ color: "#E8F4F8", flatShading: true })
    );
    belly.scale.set(0.9, 0.6, 1.5);
    belly.position.y = -0.025;
    g.add(belly);

    var tailPivot = new THREE.Group();
    tailPivot.position.z = -0.13;
    var tail = new THREE.Mesh(
      new THREE.ConeGeometry(0.05, 0.09, 4),
      new THREE.MeshStandardMaterial({ color: "#6FA9C0", flatShading: true })
    );
    tail.rotation.x = Math.PI / 2;
    tail.position.z = -0.04;
    tailPivot.add(tail);
    g.add(tailPivot);

    return { root: g, tailPivot: tailPivot };
  }

  function spawnFish(pond) {
    var built = buildFishMesh();
    var root = built.root;
    var angle = Math.random() * Math.PI * 2;
    var radius = pond.r * (0.25 + Math.random() * 0.55);
    var x = pond.x + Math.cos(angle) * radius;
    var z = pond.z + Math.sin(angle) * radius;
    root.position.set(x, pond.waterY - 0.05, z);
    scene.add(root);

    var hitbox = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 8, 8),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hitbox.userData.type = "fish";
    hitbox.userData.fishIndex = fishList.length;
    root.add(hitbox);
    fishClickTargets.push(hitbox);

    fishList.push({
      root: root, tailPivot: built.tailPivot, pond: pond,
      angle: angle, angularSpeed: (0.25 + Math.random() * 0.3) * (Math.random() < 0.5 ? 1 : -1),
      radius: radius, depthPhase: Math.random() * Math.PI * 2,
      state: "swim",
      jumpT: 0, jumpDur: 0.75,
      startPos: new THREE.Vector3(), landPos: new THREE.Vector3()
    });
  }

  ponds.forEach(function (pond) {
    var count = 3 + Math.floor(Math.random() * 2);
    for (var f = 0; f < count; f++) spawnFish(pond);
  });

  function triggerFishJump(index) {
    var fish = fishList[index];
    if (!fish || fish.state !== "swim") return;
    var pond = fish.pond;
    var dx = fish.root.position.x - pond.x;
    var dz = fish.root.position.z - pond.z;
    var d = Math.sqrt(dx * dx + dz * dz) || 0.001;
    var dirX = dx / d, dirZ = dz / d;
    var landDist = pond.r + 1.0 + Math.random() * 0.8;
    var landX = pond.x + dirX * landDist;
    var landZ = pond.z + dirZ * landDist;
    fish.startPos.copy(fish.root.position);
    fish.landPos.set(landX, groundHeight(landX, landZ), landZ);
    fish.jumpT = 0;
    fish.state = "jump";
    showToast(t("toast.fishJump"));
  }

  function updateFish(dt, elapsed) {
    for (var i = 0; i < fishList.length; i++) {
      var f = fishList[i];
      if (f.state === "swim") {
        f.angle += f.angularSpeed * dt;
        var x = f.pond.x + Math.cos(f.angle) * f.radius;
        var z = f.pond.z + Math.sin(f.angle) * f.radius;
        var y = f.pond.waterY - 0.05 + Math.sin(elapsed * 2 + f.depthPhase) * 0.012;
        f.root.position.set(x, y, z);
        var heading = f.angle + (f.angularSpeed > 0 ? Math.PI / 2 : -Math.PI / 2);
        f.root.rotation.y = heading;
        f.tailPivot.rotation.y = Math.sin(elapsed * 9 + f.depthPhase) * 0.6;
      } else if (f.state === "jump") {
        f.jumpT += dt;
        var fp = Math.min(f.jumpT / f.jumpDur, 1);
        var x2 = THREE.MathUtils.lerp(f.startPos.x, f.landPos.x, fp);
        var z2 = THREE.MathUtils.lerp(f.startPos.z, f.landPos.z, fp);
        var arc = Math.sin(fp * Math.PI) * 1.4;
        f.root.position.set(x2, THREE.MathUtils.lerp(f.startPos.y, f.landPos.y, fp) + arc, z2);
        f.root.rotation.x += dt * 14;
        if (fp >= 1) {
          f.root.rotation.x = 0;
          f.root.position.copy(f.landPos);
          var food = {
            group: f.root, pos: new THREE.Vector2(f.landPos.x, f.landPos.z),
            active: true, born: performance.now(), eaten: false, skipPopIn: true,
            byPlayer: true // the player startled this fish ashore
          };
          foods.push(food);
          attractPuffinsToFood(food);
          f.state = "gone";
          f.pond.pendingRespawnAt = performance.now() + 3000 + Math.random() * 3000;
        }
      }
    }
  }

  function updatePondRespawns(now) {
    for (var i = 0; i < ponds.length; i++) {
      var pond = ponds[i];
      if (pond.pendingRespawnAt && now >= pond.pendingRespawnAt) {
        spawnFish(pond);
        pond.pendingRespawnAt = null;
      }
    }
  }

  // ===============================================================
  // 9c. Particle bursts — reused for whale spout + surface/dive splash
  // ===============================================================
  var particles = [];
  function spawnBurst(originVec3, count, colorHex, speedMin, speedMax, spread, sizeMul) {
    for (var i = 0; i < count; i++) {
      var m = new THREE.Mesh(
        new THREE.SphereGeometry((0.035 + Math.random() * 0.03) * (sizeMul || 1), 5, 5),
        new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 })
      );
      m.position.copy(originVec3);
      var ang = Math.random() * Math.PI * 2;
      var upSpeed = speedMin + Math.random() * (speedMax - speedMin);
      var outSpeed = Math.random() * spread;
      var vel = new THREE.Vector3(Math.cos(ang) * outSpeed, upSpeed, Math.sin(ang) * outSpeed);
      scene.add(m);
      particles.push({ mesh: m, vel: vel, life: 0.5 + Math.random() * 0.4, maxLife: 0.9 });
    }
  }
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.vel.y -= 2.4 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.life -= dt;
      var lifeFrac = Math.max(0, p.life / p.maxLife);
      p.mesh.material.opacity = lifeFrac * 0.9;
      p.mesh.scale.setScalar(0.6 + (1 - lifeFrac) * 0.8);
      if (p.life <= 0) {
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
        particles.splice(i, 1);
      }
    }
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInCubic(t) { return t * t * t; }

  // ===============================================================
  // 9d. Whales — surface occasionally, click to spout (shrinks),
  //     feed them in the water to grow them back
  // ===============================================================
  var whales = [];
  var whaleClickTargets = [];
  var MIN_WHALE_SCALE = 0.42, MAX_WHALE_SCALE = 1.25, BASE_WHALE_SCALE = 1.0;
  var WHALE_MODEL_SCALE = 3.0; // overall model size multiplier, independent of the grow/shrink mechanic above
  var DIVE_DEPTH = 2.2 * WHALE_MODEL_SCALE; // must submerge past the model's own height, or it pokes above water
  var WHALE_SURFACE_CUT = 0.74; // fraction of body height kept below the waterline while "surfaced" — only the back/dorsal should break the surface
  var SPOUT_SHRINK = 0.12, FEED_GROW = 0.16;
  var WHALE_SWIM_SPEED = 2.6;

  function buildWhale(palette) {
    var root = new THREE.Group();
    var bob = new THREE.Group();
    root.add(bob);

    palette = palette || {};
    var dark = mat(palette.dark || "#3A4F5C");
    var light = mat(palette.light || "#DCE6E8");
    var finMat = mat(palette.fin || "#33454F");

    var body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 1), dark);
    body.scale.set(0.62, 0.55, 1.65);
    body.position.y = 0.5;
    body.castShadow = true;
    bob.add(body);

    var belly = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 1), light);
    belly.scale.set(0.55, 0.4, 1.4);
    belly.position.set(0, 0.28, 0.05);
    bob.add(belly);

    var dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 4), dark);
    dorsal.position.set(0, 0.92, 0.15);
    dorsal.rotation.x = 0.15;
    bob.add(dorsal);

    var tailPivot = new THREE.Group();
    tailPivot.position.set(0, 0.42, -1.15);
    bob.add(tailPivot);
    [-1, 1].forEach(function (side) {
      var fluke = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.55, 4), dark);
      fluke.rotation.z = Math.PI / 2;
      fluke.position.set(side * 0.28, 0, 0);
      fluke.scale.set(1, 1, 0.35);
      tailPivot.add(fluke);
    });

    var finPivots = [-1, 1].map(function (side) {
      var pivot = new THREE.Group();
      pivot.position.set(side * 0.38, 0.35, 0.35);
      bob.add(pivot);
      var fin = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.42, 4), finMat);
      fin.rotation.z = side * (Math.PI / 2 - 0.3);
      fin.scale.set(1, 1, 0.3);
      pivot.add(fin);
      return pivot;
    });

    var blowholeLocal = new THREE.Vector3(0, 0.93, 0.55);
    return { root: root, bob: bob, tailPivot: tailPivot, finPivots: finPivots, blowholeLocal: blowholeLocal };
  }

  var CALF_PALETTE = { dark: "#7FBF9E", light: "#E2F6EA", fin: "#5FA884" };
  var CALF_MODEL_SCALE = WHALE_MODEL_SCALE * 0.42;

  function spawnWhaleSlot(opts) {
    opts = opts || {};
    var index = whales.length;
    var built = buildWhale(opts.palette);
    var root = built.root;
    root.visible = false;
    scene.add(root);

    var hitbox = new THREE.Mesh(
      new THREE.BoxGeometry(1.3, 0.55, 2.4),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hitbox.position.y = 0.85; // matches the back/dorsal area that actually breaks the surface,
    // so clicking open water near a mostly-submerged whale doesn't register as a whale click
    hitbox.userData.type = "whale";
    hitbox.userData.whaleIndex = index;
    root.add(hitbox);
    whaleClickTargets.push(hitbox);

    whales.push({
      root: root, bob: built.bob, tailPivot: built.tailPivot, finPivots: built.finPivots, blowholeLocal: built.blowholeLocal,
      state: "hidden",
      timer: opts.timer != null ? opts.timer : (2 + index * 5 + Math.random() * 6),
      spawnNear: opts.spawnNear || null,
      pos: new THREE.Vector2(0, 0),
      targetPos: new THREE.Vector2(0, 0),
      riseT: 0, riseDur: 1.6,
      diveT: 0, diveDur: 1.6,
      presentTimer: 0,
      scale: opts.scale != null ? opts.scale : BASE_WHALE_SCALE,
      modelScale: opts.modelScale || WHALE_MODEL_SCALE,
      isCalf: !!opts.isCalf,
      hasSpawnedCalf: false,
      foodRef: null,
      bobPhase: Math.random() * Math.PI * 2,
      action: null, actionT: 0, actionCooldown: 4 + Math.random() * 6
    });
  }
  for (var wi = 0; wi < 3; wi++) spawnWhaleSlot();

  function pickWhaleSurfacePos(w) {
    if (w.spawnNear) {
      var nx = THREE.MathUtils.clamp(w.spawnNear.x + (Math.random() - 0.5) * 10, -(PLAY_HALF_WIDTH - 4), PLAY_HALF_WIDTH - 4);
      var nz = THREE.MathUtils.clamp(w.spawnNear.y + (Math.random() - 0.5) * 10, PLAY_OCEAN_FAR_Z + 8, -10);
      w.pos.set(nx, nz);
      w.spawnNear = null;
      return;
    }
    var sp = randomSeaPoint(PLAY_OCEAN_FAR_Z + 8, -10);
    w.pos.set(sp.x, sp.z);
  }

  function triggerWhaleSpout(index) {
    var w = whales[index];
    if (!w || (w.state !== "present" && w.state !== "feeding")) return;
    w.scale = Math.max(MIN_WHALE_SCALE, w.scale - SPOUT_SHRINK);
    var worldPos = w.root.localToWorld(w.blowholeLocal.clone());
    spawnBurst(worldPos, 14, "#F4FAFC", 1.2, 2.6, 0.35);
    showToast(t("toast.whaleSpout"));
  }

  var WHALE_FOOD_RANGE = 55;

  function attractWhaleToFood(food) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < whales.length; i++) {
      var w = whales[i];
      if (w.state !== "present" || w.action) continue;
      var d = w.pos.distanceTo(food.pos);
      if (d > WHALE_FOOD_RANGE) continue;
      if (d < bestD) { bestD = d; best = w; }
    }
    if (best) {
      best.foodRef = food;
      best.targetPos.copy(food.pos);
      best.state = "feeding";
      best.presentTimer = Math.max(best.presentTimer, 6);
    }
  }

  function updateWhales(dt, elapsed, windFactor) {
    for (var i = 0; i < whales.length; i++) {
      var w = whales[i];

      if (w.state === "hidden") {
        w.timer -= dt;
        if (w.timer <= 0) {
          pickWhaleSurfacePos(w);
          var startY = oceanSurfaceY(w.pos.x, w.pos.y, elapsed, windFactor) - DIVE_DEPTH;
          w.root.position.set(w.pos.x, startY, w.pos.y);
          w.root.rotation.y = Math.random() * Math.PI * 2;
          w.root.visible = true;
          w.riseT = 0;
          w.state = "rising";
          spawnBurst(new THREE.Vector3(w.pos.x, oceanSurfaceY(w.pos.x, w.pos.y, elapsed, windFactor), w.pos.y), 10, "#EAF6FB", 0.6, 1.6, 0.7);
        }
        continue;
      }

      if (w.state === "rising") {
        w.riseT += dt;
        var rp = Math.min(w.riseT / w.riseDur, 1);
        var surfY = oceanSurfaceY(w.pos.x, w.pos.y, elapsed, windFactor);
        var riseCut = WHALE_SURFACE_CUT * w.scale * w.modelScale;
        w.root.position.y = THREE.MathUtils.lerp(surfY - DIVE_DEPTH, surfY - riseCut, easeOutCubic(rp));
        w.root.scale.setScalar(w.scale * w.modelScale);
        if (rp >= 1) { w.state = "present"; w.presentTimer = 6 + Math.random() * 6; }
        continue;
      }

      if (w.state === "present" || w.state === "feeding") {
        var surfY2 = oceanSurfaceY(w.pos.x, w.pos.y, elapsed, windFactor);
        if (w.state === "feeding") {
          var dir = new THREE.Vector2().subVectors(w.targetPos, w.pos);
          var dist = dir.length();
          if (dist < 0.4) {
            if (w.foodRef) {
              if (w.foodRef.active) { w.foodRef.active = false; consumeFood(w.foodRef); }
              w.foodRef = null;
            }
            w.scale = Math.min(MAX_WHALE_SCALE, w.scale + FEED_GROW);
            w.state = "present";
            w.presentTimer = 3 + Math.random() * 3;
            showToast(t("toast.whaleFed"));
            if (!w.isCalf && !w.hasSpawnedCalf && w.scale >= MAX_WHALE_SCALE - 0.001) {
              w.hasSpawnedCalf = true;
              spawnWhaleSlot({
                palette: CALF_PALETTE, modelScale: CALF_MODEL_SCALE, isCalf: true,
                scale: BASE_WHALE_SCALE, timer: 0.8, spawnNear: w.pos.clone()
              });
              showToast(t("toast.whaleCalf"));
            }
          } else {
            dir.normalize();
            var mv = WHALE_SWIM_SPEED * dt;
            w.pos.x += dir.x * mv; w.pos.y += dir.y * mv;
            var heading = Math.atan2(dir.x, dir.y);
            var da = heading - w.root.rotation.y;
            da = Math.atan2(Math.sin(da), Math.cos(da));
            w.root.rotation.y += da * Math.min(1, dt * 3);
          }
        }
        var swimKick = w.state === "feeding" ? 2 : 1;
        var presentCut = WHALE_SURFACE_CUT * w.scale * w.modelScale;
        w.root.position.x = w.pos.x;
        w.root.position.z = w.pos.y;
        w.root.position.y = surfY2 - presentCut + Math.sin(elapsed * 1.1 + w.bobPhase) * 0.05;
        w.tailPivot.rotation.x = Math.sin(elapsed * 2.2 + w.bobPhase) * 0.18 * swimKick;
        w.bob.rotation.z = Math.sin(elapsed * 1.1 + w.bobPhase) * 0.06;
        w.bob.rotation.x = Math.sin(elapsed * 0.85 + w.bobPhase * 1.3) * 0.045;
        w.bob.rotation.y = Math.sin(elapsed * 2.2 + w.bobPhase + Math.PI) * 0.05 * swimKick;
        w.finPivots[0].rotation.x = Math.sin(elapsed * 1.7 + w.bobPhase) * 0.14;
        w.finPivots[1].rotation.x = Math.sin(elapsed * 1.7 + w.bobPhase + Math.PI) * 0.14;
        w.root.scale.setScalar(w.scale * w.modelScale);

        // occasional flourish while calmly present: a full breach or a tail slap
        if (w.state === "present" && !w.action) {
          w.actionCooldown -= dt;
          if (w.actionCooldown <= 0) {
            var roll = Math.random();
            if (roll < 0.35) { w.action = "breach"; w.actionT = 0; w.breachSplashed = false; }
            else if (roll < 0.7) { w.action = "slap"; w.actionT = 0; w.slapped = false; }
            w.actionCooldown = 7 + Math.random() * 9;
          }
        }

        if (w.action === "slap") {
          w.actionT += dt;
          var spDur = 0.8;
          var sp = Math.min(w.actionT / spDur, 1);
          var slapAngle;
          if (sp < 0.4) { slapAngle = THREE.MathUtils.lerp(0, -0.55, sp / 0.4); }
          else { slapAngle = THREE.MathUtils.lerp(-0.55, 0.5, easeOutCubic((sp - 0.4) / 0.6)); }
          w.tailPivot.rotation.x = slapAngle;
          if (!w.slapped && sp > 0.42) {
            w.slapped = true;
            spawnBurst(w.tailPivot.getWorldPosition(new THREE.Vector3()), 16, "#EAF6FB", 1.0, 2.2, 0.5);
            showToast(t("toast.whaleSlap"));
          }
          if (sp >= 1) { w.action = null; }
        }

        if (w.action === "breach") {
          w.actionT += dt;
          var brDur = 1.7;
          var bp = Math.min(w.actionT / brDur, 1);
          var jumpH = 0.9 * w.scale * w.modelScale;
          w.root.position.y += Math.sin(bp * Math.PI) * jumpH;
          w.bob.rotation.x = Math.cos(bp * Math.PI) * -0.5;
          w.tailPivot.rotation.x += Math.sin(bp * Math.PI * 4) * 0.3 * (1 - bp);
          if (!w.breachSplashed && bp > 0.05) {
            w.breachSplashed = true;
            spawnBurst(new THREE.Vector3(w.pos.x, surfY2, w.pos.y), 14, "#EAF6FB", 1.0, 2.4, 0.6);
            showToast(t("toast.whaleBreach"));
          }
          if (bp >= 1) {
            w.action = null;
            w.bob.rotation.x = 0;
            spawnBurst(new THREE.Vector3(w.pos.x, surfY2, w.pos.y), 18, "#EAF6FB", 1.2, 2.8, 0.7);
          }
        }

        w.presentTimer -= dt;
        if (w.presentTimer <= 0 && w.state === "present" && !w.action) {
          w.state = "diving";
          w.diveT = 0;
          spawnBurst(new THREE.Vector3(w.pos.x, surfY2, w.pos.y), 10, "#EAF6FB", 0.6, 1.6, 0.7);
        }
        continue;
      }

      if (w.state === "diving") {
        w.diveT += dt;
        var dp = Math.min(w.diveT / w.diveDur, 1);
        var surfY3 = oceanSurfaceY(w.pos.x, w.pos.y, elapsed, windFactor);
        var diveCut = WHALE_SURFACE_CUT * w.scale * w.modelScale;
        w.root.position.y = THREE.MathUtils.lerp(surfY3 - diveCut, surfY3 - DIVE_DEPTH, easeInCubic(dp));
        w.tailPivot.rotation.x = Math.sin(elapsed * 2.6) * 0.28 * (1 - dp);
        w.root.scale.setScalar(w.scale * w.modelScale);
        if (dp >= 1) {
          w.state = "hidden";
          w.root.visible = false;
          w.timer = 8 + Math.random() * 10;
        }
      }
    }
  }

  // ===============================================================
  // 9e. Volcano activity — pressure builds slowly; once full the crater
  //     puffs white smoke and a click erupts it. Lava bombs splash molten
  //     pools around the base that cool to black rock, then ice back over.
  // ===============================================================
  var VOLCANO_CHARGE_TIME = 50;
  var LAVA_HOT = 14, LAVA_COOL = 16, LAVA_CRUST = 10, LAVA_THAW = 12;
  var LAVA_LIFE = LAVA_HOT + LAVA_COOL + LAVA_CRUST + LAVA_THAW;
  var FLEE_RADIUS = VOLCANO.r + 26;     // puffins closer than this bolt when it blows
  var LAVA_ZONE = VOLCANO.r * 1.1 + 16; // where bombs can land; off-limits until the ice is back

  var volcanoState = { phase: "charging", charge: 0, smokeT: 0, eruptT: 0, bombsLeft: 0, bombT: 0 };
  var lavaBombs = [], lavaPools = [], smokePuffs = [];
  var lavaPoolSerial = 0;

  var ventLight = new THREE.PointLight(0xff6a2a, 0, 70, 2);
  ventLight.position.set(VOLCANO.x, VOLCANO.ventY + 2, VOLCANO.z);
  scene.add(ventLight);
  var lavaLight = new THREE.PointLight(0xff5a1a, 0, 60, 2);
  lavaLight.position.set(VOLCANO.x, groundHeight(VOLCANO.x, VOLCANO.z) + 5, VOLCANO.z);
  scene.add(lavaLight);

  var LAVA_HOT_C = new THREE.Color("#B8300A"), LAVA_DARK_C = new THREE.Color("#4A1408");
  var BASALT_C = new THREE.Color("#1C1918"), ICE_C = new THREE.Color("#EEF4F8");
  var SMOKE_DAY = new THREE.Color("#F2F4F6"), SMOKE_NIGHT = new THREE.Color("#8E97AA");

  var smokeTex = (function () {
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g2 = c.getContext("2d");
    var grad = g2.createRadialGradient(32, 32, 2, 32, 32, 32);
    grad.addColorStop(0, "rgba(255,255,255,0.9)");
    grad.addColorStop(0.5, "rgba(255,255,255,0.45)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g2.fillStyle = grad;
    g2.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  function spawnSmoke(ash) {
    var mat = new THREE.SpriteMaterial({
      map: smokeTex, color: ash ? "#3B3634" : "#F2F4F6", transparent: true, opacity: 0, depthWrite: false
    });
    var s = new THREE.Sprite(mat);
    s.position.set(VOLCANO.x + (Math.random() - 0.5) * 1.6, VOLCANO.ventY + 0.5, VOLCANO.z + (Math.random() - 0.5) * 1.6);
    var size0 = ash ? 2.8 : 2.4;
    s.scale.setScalar(size0);
    scene.add(s);
    smokePuffs.push({
      sprite: s, mat: mat, life: 0, maxLife: ash ? 5 : 6.5, size0: size0, grow: ash ? 10 : 8,
      rise: ash ? 3.2 : 1.6, ash: ash, maxOpacity: ash ? 0.85 : 0.8, drift: (Math.random() - 0.5) * 0.6
    });
  }

  function updateSmoke(dt, wind01, nightAmt) {
    for (var i = smokePuffs.length - 1; i >= 0; i--) {
      var s = smokePuffs[i];
      s.life += dt;
      var f = s.life / s.maxLife;
      if (f >= 1) { scene.remove(s.sprite); s.mat.dispose(); smokePuffs.splice(i, 1); continue; }
      s.sprite.position.y += s.rise * dt * (1 - f * 0.5);
      s.sprite.position.x += (wind01 * 2.2 + s.drift) * dt;
      s.sprite.scale.setScalar(s.size0 + s.grow * f);
      s.mat.opacity = s.maxOpacity * Math.min(1, s.life / 0.6) * (1 - f);
      if (!s.ash) s.mat.color.copy(SMOKE_DAY).lerp(SMOKE_NIGHT, nightAmt);
    }
  }

  // irregular flat blob, draped onto the gently rolling snow so no edge sinks under it
  function makeLavaGeometry(cx, cz, r, baseY) {
    var segs = 18, seedA = Math.random() * Math.PI * 2, seedB = Math.random() * Math.PI * 2;
    var shape = new THREE.Shape();
    for (var i = 0; i < segs; i++) {
      var a = (i / segs) * Math.PI * 2;
      var rr = r * (1 + 0.22 * Math.sin(a * 3 + seedA) + 0.12 * Math.sin(a * 5 + seedB) + (Math.random() - 0.5) * 0.1);
      if (i === 0) shape.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else shape.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    shape.closePath();
    var geo = new THREE.ShapeGeometry(shape, 1);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position;
    for (var v = 0; v < pos.count; v++) {
      pos.setY(v, groundHeight(cx + pos.getX(v), cz + pos.getZ(v)) - baseY + 0.06);
    }
    geo.computeVertexNormals();
    return geo;
  }

  function spawnLavaPool(x, z, r) {
    var mat = new THREE.MeshStandardMaterial({
      color: LAVA_HOT_C.clone(), emissive: "#FF3A00", emissiveIntensity: 0.9,
      roughness: 0.55, transparent: true, opacity: 1
    });
    lavaPoolSerial++;
    var baseY = groundHeight(x, z) + 0.03 + (lavaPoolSerial % 12) * 0.004; // staggered so overlaps don't z-fight
    var mesh = new THREE.Mesh(makeLavaGeometry(x, z, r, baseY), mat);
    mesh.position.set(x, baseY, z);
    mesh.scale.set(0.01, 1, 0.01);
    mesh.receiveShadow = true;
    scene.add(mesh);
    lavaPools.push({ mesh: mesh, mat: mat, age: 0, pulse: Math.random() * 6 });
  }

  // returns how hot the hottest pool still is (0..1), used to drive the ground glow light
  function updateLavaPools(dt, elapsed) {
    var hottest = 0;
    for (var i = lavaPools.length - 1; i >= 0; i--) {
      var p = lavaPools[i];
      p.age += dt;
      var a = p.age;
      if (a >= LAVA_LIFE) {
        scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mat.dispose();
        lavaPools.splice(i, 1);
        continue;
      }
      var s = easeOutCubic(Math.min(1, a / 0.6));
      p.mesh.scale.set(s, 1, s);
      var heat = 0;
      if (a < LAVA_HOT) {
        heat = 1;
        p.mat.color.copy(LAVA_HOT_C);
      } else if (a < LAVA_HOT + LAVA_COOL) {
        var c = (a - LAVA_HOT) / LAVA_COOL;
        heat = 1 - c;
        if (c < 0.5) p.mat.color.copy(LAVA_HOT_C).lerp(LAVA_DARK_C, c * 2);
        else p.mat.color.copy(LAVA_DARK_C).lerp(BASALT_C, (c - 0.5) * 2);
      } else if (a < LAVA_HOT + LAVA_COOL + LAVA_CRUST) {
        p.mat.color.copy(BASALT_C);
      } else {
        // frost creeps over the black crust, then it melts away into the snow
        var th = (a - LAVA_HOT - LAVA_COOL - LAVA_CRUST) / LAVA_THAW;
        p.mat.color.copy(BASALT_C).lerp(ICE_C, Math.min(1, th * 1.6));
        p.mat.opacity = 1 - Math.max(0, (th - 0.4) / 0.6);
      }
      p.mat.emissiveIntensity = heat * (0.85 + Math.sin(elapsed * 3 + p.pulse) * 0.2);
      if (heat > hottest) hottest = heat;
    }
    return hottest;
  }

  function launchLavaBomb() {
    var ang, dist, tx, tz;
    for (var tries = 0; tries < 8; tries++) {
      ang = Math.random() * Math.PI * 2;
      dist = VOLCANO.r * 1.12 + Math.random() * 14;
      tx = VOLCANO.x + Math.cos(ang) * dist;
      tz = VOLCANO.z + Math.sin(ang) * dist;
      if (!nearYoungPath(tx, tz)) break;
    }
    var start = new THREE.Vector3(VOLCANO.x + (Math.random() - 0.5) * 1.2, VOLCANO.ventY, VOLCANO.z + (Math.random() - 0.5) * 1.2);
    var end = new THREE.Vector3(tx, groundHeight(tx, tz), tz);
    var mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.28 + Math.random() * 0.25, 0),
      new THREE.MeshBasicMaterial({ color: "#FFB066" })
    );
    mesh.position.copy(start);
    scene.add(mesh);
    // arc of 9+ units keeps the bomb above the cone's slope the whole way down
    lavaBombs.push({
      mesh: mesh, start: start, end: end, t: 0, dur: 1.3 + dist / 22, arc: 9 + Math.random() * 9,
      trailT: 0, spinX: Math.random() * 6, spinY: Math.random() * 6
    });
  }

  function updateLavaBombs(dt) {
    for (var i = lavaBombs.length - 1; i >= 0; i--) {
      var b = lavaBombs[i];
      b.t += dt;
      var f = Math.min(1, b.t / b.dur);
      b.mesh.position.lerpVectors(b.start, b.end, f);
      b.mesh.position.y += b.arc * 4 * f * (1 - f);
      b.mesh.rotation.x += b.spinX * dt;
      b.mesh.rotation.y += b.spinY * dt;
      b.trailT -= dt;
      if (b.trailT <= 0) { b.trailT = 0.07; spawnBurst(b.mesh.position, 1, "#FF7A2A", 0, 0.4, 0.3, 4); }
      if (f >= 1) {
        spawnBurst(new THREE.Vector3(b.end.x, b.end.y + 0.2, b.end.z), 8, "#FF8A3D", 1.2, 3.2, 1.2, 5);
        spawnLavaPool(b.end.x, b.end.z, 1.4 + Math.random() * 2.0);
        scene.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose();
        lavaBombs.splice(i, 1);
      }
    }
  }

  function pointInLavaZone(x, z) {
    if (volcanoState.phase !== "erupting" && volcanoState.phase !== "cooling") return false;
    return Math.hypot(x - VOLCANO.x, z - VOLCANO.z) < LAVA_ZONE;
  }

  // nearby puffins fly radially away from the volcano; their "home" moves with
  // them until the lava is gone, so they don't wander straight back into it
  function scarePuffinsFromVolcano() {
    var fled = 0;
    var tries = [0, 0.35, -0.35, 0.7, -0.7, 1.1, -1.1, 1.6, -1.6];
    for (var i = 0; i < puffins.length; i++) {
      var p = puffins[i];
      var dx = p.root.position.x - VOLCANO.x, dz = p.root.position.z - VOLCANO.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      var fleeR = FLEE_RADIUS * persona(p).flee; // timid ones bolt from further away
      if (d > fleeR) continue;
      if (youth(p) < 2) { if (escapeOnFoot(p)) fled++; continue; } // young birds can't make the long flight

        var tx = THREE.MathUtils.clamp(VOLCANO.x + Math.cos(a) * safeD, -PLAY_HALF_WIDTH + 3, PLAY_HALF_WIDTH - 3);

      p.react = null;
      p.stirT = 0;
      p.visiting = false;
      p.watchT = 0;
      p.fleeing = true;

      p.sleepAmt = 0;
      p.bob.rotation.x = 0; p.bob.scale.y = 1; p.headPivot.rotation.x = 0;

  // E2: chicks and juveniles scurry away on foot, along a straight line that

  function escapeOnFoot(p) {

    var dists = [Math.max(d + 14, FLEE_RADIUS + 4), LAVA_ZONE + 4];

      for (var k = 0; k < offsets.length && !target; k++) {
        var a = base + offsets[k];

      }
    }
    if (!target) return false;
    if (!p.fledFrom) p.fledFrom = p.home.clone();
    p.home.copy(target);
    p.target.copy(target);
    p.foodRef = null;
    p.react = null;
    p.practice = null;
    p.stirT = 0;
    p.visiting = false;
    p.watchT = 0;
    p.sleepAmt = 0;
    p.root.rotation.x = 0; p.root.rotation.z = 0; p.root.scale.setScalar(1);

  // lava bombs re-roll a landing spot that would hit a young bird or its escape line

    if (!c.scurry) return Math.hypot(x - px, z - pz) < 3.5;
    var sx = c.target.x - px, sz = c.target.y - pz, len2 = sx * sx + sz * sz || 1;

  function updateVolcano(dt, elapsed, wind01, nightAmt) {

      ventGlow = vs.charge * 0.9;
      ventLightI = vs.charge * vs.charge * 0.8;
      if (vs.charge >= 1) {
        vs.phase = "ready";

    } else if (vs.phase === "ready") {
      ventGlow = 1 + Math.sin(elapsed * 2.4) * 0.25;

      ventLightI = ventGlow;
      if (lavaPools.length === 0) {

  // ---- arctic fox: trots in, looks about, sniffs, maybe pounces nose-first

    });
    visitorPart(headPivot, new THREE.ConeGeometry(0.055, 0.15, 4), fur, 0, 0.02, 0.21).rotation.x = Math.PI / 2; // snout
    visitorPart(headPivot, new THREE.IcosahedronGeometry(0.022, 0), dark, 0, 0.03, 0.29); // nose
    var legs = [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(function (lp) { // FL, FR, BL, BR

        var u = ((v.t + m.phase) % ORCA_CYCLE) / ORCA_CYCLE;
        if (u < 0.42) { // surfacing roll: head, back, fin, then down
          var s = u / 0.42, liftK = Math.sin(Math.PI * s);
          y = surf - deep + liftK * (deep + top);
          pitch = -Math.cos(Math.PI * s) * 0.3;
          if (!m.wasUp) { m.wasUp = true; m.spouted = false; spawnBurst(new THREE.Vector3(x, surf, z), 6, "#EAF6FB", 0.5, 1.2, 0.5); }
          if (!m.spouted && s > 0.35) {
            m.spouted = true;
            if (Math.random() < 0.45) spawnBurst(root.localToWorld(m.b.blowholeLocal.clone()), 10, "#F4FAFC", 1.0, 2.2, 0.3);
          }
          m.up = liftK > 0.55; m.under = false;
        } else {
          y = surf - deep;
          m.wasUp = false; m.up = false; m.under = true;
        }
      }
      root.position.set(x, y, z);
      m.b.bob.rotation.x = easeTo(m.b.bob.rotation.x, pitch, 8, dt);
      m.b.tailPivot.rotation.x = Math.sin(elapsed * 3 + m.phase) * 0.25;
      m.b.fins[0].rotation.x = Math.sin(elapsed * 1.7 + m.phase) * 0.15;
      m.b.fins[1].rotation.x = -m.b.fins[0].rotation.x;
      root.visible = Math.hypot(x, z) < 170; // past the soft world edge it's simply gone
    });
    return allPast;
  }

  function tapVisitor(box) {
    var v = box.userData.visitor;
    if (!v || v !== visitor) return false;
    if (v.kind === "fox") {
      if (v.alpha < 0.5) return false;
      if (v.act !== "pounce" && !v.fled) { v.noticeT = FOX_ACT_DUR.notice; v.act = null; }
      showToast(t("visitor.fox.tap"), 2400);
      return true;
    }
    if (v.kind === "owl") {
      if (v.phase !== "perch") return false;
      // swivel round to face you (as far as an owl's neck goes) and blink twice
      var rel = Math.atan2(camera.position.x - v.perch.x, camera.position.z - v.perch.z) - v.b.root.rotation.y;
      rel = Math.atan2(Math.sin(rel), Math.cos(rel));
      v.headTarget = THREE.MathUtils.clamp(rel, -2.4, 2.4);
      v.noticeT = 2.6;
      v.headHold = 0;
      v.blinkT = 0.4;
      showToast(t("visitor.owl.tap"), 2400);
      return true;
    }
    var m = v.members[box.userData.member];
    if (!m || !m.up) return false; // only while it's actually at the surface
    spawnBurst(m.b.root.localToWorld(m.b.blowholeLocal.clone()), 14, "#F4FAFC", 1.2, 2.6, 0.35);
    showToast(t("visitor.orca.tap"));

    if (visitorTimer > 0) return;
    // not in the middle of an eruption: there's enough going on

    var kind = skyPreview.visitor || pickVisitorKind();
    visitor = kind === "fox" ? spawnFox() : kind === "owl" ? spawnOwl() : spawnOrcaPod();
    if (!visitor) { visitorTimer = VISITOR_CFG.RETRY; return; } // nowhere good right now; a preview keeps its kind

  var raycaster = new THREE.Raycaster();

  function setPointerFromEvent(e) {
    var cx = e.clientX, cy = e.clientY;
    pointerNDC.x = (cx / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(cy / window.innerHeight) * 2 + 1;
  }

    downPos = { x: e.clientX, y: e.clientY, button: e.button };
  });

  renderer.domElement.addEventListener("pointerup", function (e) {
    if (!downPos || e.button !== 0) { downPos = null; return; }
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    downPos = null;
    if (Math.sqrt(dx * dx + dy * dy) > 6) return;

    setPointerFromEvent(e);
    raycaster.setFromCamera(pointerNDC, camera);

    var hits = raycaster.intersectObjects(clickTargets, false);
    if (hits.length > 0) {
      var hitIdx = hits[0].object.userData.puffinIndex;
      triggerSpin(hitIdx);
      selectPuffin(puffins[hitIdx].id);
      return;
    }
    var visitorHits = raycaster.intersectObjects(visitorClickTargets, false);
    for (var vh = 0; vh < visitorHits.length; vh++) {
      if (tapVisitor(visitorHits[vh].object)) return;
    }
    var fishHits = raycaster.intersectObjects(fishClickTargets, false);
    for (var fh = 0; fh < fishHits.length; fh++) {
      var fIdx = fishHits[fh].object.userData.fishIndex;
      var fObj = fishList[fIdx];
      if (fObj && fObj.state === "swim") {
        triggerFishJump(fIdx);
        return;
      }
    }
    var whaleHits = raycaster.intersectObjects(whaleClickTargets, false);
    for (var wh = 0; wh < whaleHits.length; wh++) {
      var wIdx = whaleHits[wh].object.userData.whaleIndex;
      var wObj = whales[wIdx];
      if (wObj && (wObj.state === "present" || wObj.state === "feeding")) {
        triggerWhaleSpout(wIdx);
        return;
      }
    }
    var surfaceHits = raycaster.intersectObjects([ground, ocean], false);
    // the volcano only wins if it's actually in front of the snow along this ray
    var volcanoHits = raycaster.intersectObject(VOLCANO.group, true);
    if (volcanoHits.length > 0 && (surfaceHits.length === 0 || volcanoHits[0].distance < surfaceHits[0].distance)) {
      onVolcanoClicked();
      return;
    }
    if (surfaceHits.length > 0) {
      var hit = surfaceHits[0];
      var hx = hit.point.x, hz = hit.point.z;
      if (hit.object === ground) {
        if (pointInAnyMountain(hx, hz)) {
          showToast(t("toast.mountain"));

          showToast(t("toast.lavaHot"));

          spawnFood(hx, hz);
        }
      } else {
        spawnSeaFood(hx, hz);
      }
    }
  });

  function locatePuffin(p) {
    if (!p) return;

    offset.setLength(dist);
    // keep a pleasant look-down angle rather than skimming the snow
    var minY = dist * 0.32;
    if (offset.y < minY) {
      var flat = Math.hypot(offset.x, offset.z) || 1;
      var horiz = Math.sqrt(Math.max(0.0001, dist * dist - minY * minY));
      offset.set(offset.x / flat * horiz, minY, offset.z / flat * horiz);

      k = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; // ease in-out
      focusPoint(tp, tmpFocus);
      controls.target.lerpVectors(camTween.fromT, tmpFocus, k);
      camera.position.lerpVectors(camTween.fromP, tmpFocus.clone().add(camTween.offset), k);

      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = displayName(rec); // user text: never parsed as HTML
      var stg = document.createElement("span");
      stg.className = "st";
      stg.textContent = t("stage." + stageOf(rec)) + " · " + rec.affinity;
      var bar = document.createElement("span");
      bar.className = "mini-bar";
      var fill = document.createElement("i");
      fill.style.width = rec.affinity + "%";
      bar.appendChild(fill);
      b.appendChild(nm); b.appendChild(stg); b.appendChild(bar);
      b.addEventListener("click", function () {
        selectPuffin(rec.id);
        locatePuffin(puffinById[rec.id]);
        setListOpen(false);
      });
      companionList.appendChild(b);
    });
  }
  function refreshCompanionUI() {
    refreshList();
    refreshCard();
    refreshChickPanel();
    pc.Close.setAttribute("aria-label", t("card.close"));
  }

  function selectPuffin(id) {
    if (!puffinById[id]) return;
    if (selectedId !== id) {
      if (followId && followId !== id) followId = null;
      nameMode = null;
    }
    selectedId = id;
    refreshCard();
  }
  function closeCard() {
    selectedId = null;
    followId = null;
    nameMode = null;
    cardEl.hidden = true;
  }

  function openNameForm(mode) {
    var p = selectedId && puffinById[selectedId];
    if (!p) return;
    nameMode = mode;
    setText(pc.NameLabel, t(mode === "adopt" ? "card.nameAdopt" : "card.nameRename"));
    setText(pc.NameOk, t(mode === "adopt" ? "card.adopt" : "card.save"));
    pc.NameInput.value = displayName(p.rec);
    setText(pc.NameErr, "");
    refreshCard();
    pc.NameInput.focus();
    pc.NameInput.select();
  }
  function closeNameForm() {
    nameMode = null;
    refreshCard();
  }
  function submitName() {
    var p = selectedId && puffinById[selectedId];
    if (!p || !nameMode) return;
    var name = cleanName(pc.NameInput.value);
    if (!name) { setText(pc.NameErr, t("card.nameError")); pc.NameInput.focus(); return; }
    var rec = p.rec, mode = nameMode;
    if (mode === "adopt") {
      if (rec.adopted) { closeNameForm(); return; }
      if (adoptedCount() >= MAX_ADOPTED) { setText(pc.NameErr, t("card.limit", { n: MAX_ADOPTED })); return; }
      var now = Date.now();
      rec.adopted = true;
      rec.adoptedAt = now;
      rec.affinity = 0;
      rec.lastRewardAt = 0;
      rec.dailyGained = 0;
      rec.dailyDate = localDayKey(now);
    }
    // keeping the default name leaves it unset, so it keeps following the UI language
    rec.customName = name === defaultName(rec) ? null : name;
    saveRoster();
    nameMode = null;
    showToast(t(mode === "adopt" ? "toast.adopted" : "toast.renamed", { name: displayName(rec) }), 2000);
    refreshCompanionUI();
    pc.Pet.focus();
  }

  pc.Close.addEventListener("click", closeCard);
  pc.Adopt.addEventListener("click", function () { openNameForm("adopt"); });
  pc.Rename.addEventListener("click", function () { openNameForm("rename"); });
  pc.Pet.addEventListener("click", function () {
    var p = selectedId && puffinById[selectedId];
    if (p) { petPuffin(p); refreshCard(); }
  });
  pc.Locate.addEventListener("click", function () { locatePuffin(selectedId && puffinById[selectedId]); });
  pc.Follow.addEventListener("click", function () { setFollow(followId !== selectedId); });
  pc.NameForm.addEventListener("submit", function (e) { e.preventDefault(); submitName(); });
  pc.NameCancel.addEventListener("click", closeNameForm);
  companionBtn.addEventListener("click", function () {
    var open = companionList.hidden;
    if (open) setChickPanelOpen(false);
    setListOpen(open);
  });
  cardEl.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (nameMode) closeNameForm(); else closeCard();
  });
  companionList.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { setListOpen(false); companionBtn.focus(); }
  });

  chickBtn.addEventListener("click", function () { setChickPanelOpen(chickPanel.hidden); });
  ck.Form.addEventListener("submit", function (e) { e.preventDefault(); adoptChick(); });
  ck.ViewBtn.addEventListener("click", function () {
    if (!chickEntity) return;
    setChickPanelOpen(false);
    selectPuffin(chickEntity.id);
    locatePuffin(chickEntity);
  });
  chickPanel.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { setChickPanelOpen(false); chickBtn.focus(); }
  });
  pc.Practice.addEventListener("click", function () {
    var p = selectedId && puffinById[selectedId];
    if (!p) return;
    var res = startPractice(p);
    if (res === "noRoute") showToast(t("practice.noRoute"), 2400);
    refreshCard();
  });

  var cardRefreshT = 0;
  function updateCompanions(dt, elapsed) {
    var sp = selectedId && puffinById[selectedId];
    selectRing.visible = !!sp;
    if (sp) {
      var rx = sp.root.position.x, rz = sp.root.position.z;
      selectRing.position.set(rx, groundHeight(rx, rz) + 0.045, rz);
      selectRing.scale.setScalar((1 + Math.sin(elapsed * 3) * 0.06) * Math.max(0.6, sp.sizeNow || 1));
      selectRing.material.opacity = 0.65 + Math.sin(elapsed * 3) * 0.2;
    }
    updateHearts(dt);
    cardRefreshT -= dt;
    if (cardRefreshT <= 0) { cardRefreshT = 0.25; if (sp) refreshCard(); }
  }

  // ===============================================================
  // 11. UI wiring
  // ===============================================================
  var windRange = document.getElementById("windRange");
  var windText = document.getElementById("windText");
  var currentWind01 = 0.24;

  function windLabel(v) {
    if (v < 8) return t("wind.calm");
    if (v < 35) return t("wind.breeze");
    if (v < 70) return t("wind.strong");
    return t("wind.gale");
  }
  function applyWindUI(v) {
    windRange.style.setProperty("--fill", v + "%");
    windText.textContent = windLabel(v);
  }
  applyWindUI(windRange.value);
  windRange.addEventListener("input", function () {
    var v = parseFloat(windRange.value);
    currentWind01 = v / 100;
    applyWindUI(v);
  });

  // E3: the sky follows the player's local clock ("auto"). A tap switches it
  // by hand for this visit; the next tap — or the clock reaching the same
  // state on its own — hands it back to the clock. Nothing is saved, so every
  // visit starts on local time: open it in the evening and it's polar night.
  var dayToggle = document.getElementById("dayToggle");
  var dayToggleText = document.getElementById("dayToggleText");
  var skyMode = "auto";
  var isNight = clockSaysNight(skyNow());
  dayNight.target = dayNight.current = isNight ? 1 : 0; // start there, no fade on load
  function applyDayToggleUI() {
    dayToggle.classList.toggle("night", isNight);
    dayToggle.classList.toggle("manual", skyMode === "manual");
    dayToggleText.textContent = t(isNight ? "night" : "day");
    var tip = t(skyMode === "auto" ? "sky.autoTitle" : "sky.manualTitle");
    dayToggle.title = tip;
    dayToggle.setAttribute("aria-label", t(isNight ? "night" : "day") + " · " + tip);
  }
  function setNight(night, speed, tonightDelay) {
    var fell = night && !isNight;
    isNight = night;
    dayNight.target = night ? 1 : 0;
    dayNight.speed = speed;
    applyDayToggleUI();
    if (fell) announceTonight(tonightDelay);
  }
  function skyStateWord() { return t(isNight ? "sky.state.night" : "sky.state.day"); }
  function toggleSky() {
    if (skyMode === "auto") {
      skyMode = "manual";
      setNight(!isNight, 0.85, 2900);
      showToast(t("toast.skyManual", { state: skyStateWord() }), 2600);
    } else {
      skyMode = "auto";
      setNight(clockSaysNight(skyNow()), 0.85, 2500);
      showToast(t("toast.skyAuto", { state: skyStateWord() }), 2200);
    }
  }
  dayToggle.addEventListener("click", toggleSky);
  dayToggle.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSky(); }
  });

  // once per visit, the first time the sky goes dark: say if tonight is special
  var tonightAnnounced = false;
  function announceTonight(delay) {
    if (tonightAnnounced) return;
    var now = skyNow(), parts = [];
    var sh = showerTonight(now);
    if (sh) parts.push(t(sh.peak ? "sky.showerPeak" : "sky.showerActive", { name: t("shower." + sh.key) }));
    if (isFullMoon(moonPhase(now.getTime()))) parts.push(t("sky.fullMoon"));
    if (!parts.length) return;
    tonightAnnounced = true;
    setTimeout(function () { showToast(parts.join(" · "), 4200); }, delay || 0);
  }

  // checked about once a second: moon, tonight's shower, and dusk/dawn
  var skyTickT = 0;
  function updateSkyClock(dt) {
    skyTickT -= dt;
    if (skyTickT > 0) return;
    skyTickT = 1;
    var now = skyNow();
    var hadShower = !!activeShower;
    activeShower = showerTonight(now);
    if (activeShower && !hadShower) meteorTimer = Math.min(meteorTimer, 1.2); // don't make a shower night wait
    refreshMoon(now);
    var clockNight = clockSaysNight(now);
    if (skyMode === "manual") {
      if (clockNight === isNight) { skyMode = "auto"; applyDayToggleUI(); } // the clock caught up with the choice
    } else if (clockNight !== isNight) {
      showToast(t(clockNight ? "toast.dusk" : "toast.dawn"), 2600);
      setNight(clockNight, DUSK_FADE_SPEED, 2900);
    }
  }

  var langToggle = document.getElementById("langToggle");
  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = t("docTitle");
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    // hint strings are our own static markup (just <b>), never user input
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      el.innerHTML = t(el.getAttribute("data-i18n-html"));
    });
    applyWindUI(windRange.value);
    applyDayToggleUI();
    langToggle.textContent = t("langButton");
    langToggle.setAttribute("aria-label", t("langButtonLabel"));
    langToggle.title = t("langButtonLabel");
    if (nameMode) {
      setText(pc.NameLabel, t(nameMode === "adopt" ? "card.nameAdopt" : "card.nameRename"));
      setText(pc.NameOk, t(nameMode === "adopt" ? "card.adopt" : "card.save"));
      if (pc.NameErr.textContent) setText(pc.NameErr, t("card.nameError"));
    }
    if (!chickRec && !chickPanel.hidden) {
      // an untouched suggestion follows the language; a typed name is left alone
      var otherSuggestion = CHICK_NAMES[lang === "zh" ? "en" : "zh"][chickSuggestIdx];
      if (ck.NameInput.value === otherSuggestion) ck.NameInput.value = CHICK_NAMES[lang][chickSuggestIdx];
      if (ck.NameErr.textContent) setText(ck.NameErr, "");
    }
    refreshCompanionUI();
  }
  langToggle.addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  });
  applyLang();

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 1400);
  }

  // ===============================================================
  // 12. Loading overlay
  // ===============================================================
  var loadingEl = document.getElementById("loading");
  var loadBar = document.getElementById("loadBar");
  var fakeProgress = 0, loadingDone = false;
  var loadingInterval = setInterval(function () {
    fakeProgress += (100 - fakeProgress) * 0.25 + 2;
    if (fakeProgress > 96) fakeProgress = 96;
    loadBar.style.width = fakeProgress + "%";
  }, 90);
  function finishLoading() {
    if (loadingDone) return;
    loadingDone = true;
    clearInterval(loadingInterval);
    loadBar.style.width = "100%";
    setTimeout(function () {
      loadingEl.classList.add("hide");
      setTimeout(function () { loadingEl.style.display = "none"; }, 650);
      // one short heads-up about the care save, then never again this session
      var saveNote = false;
      if (!storageOK) { saveWarned = true; showToast(t("toast.noSave"), 3600); saveNote = true; }
      else if (rosterLoad.problem && savedRaw) { showToast(t("toast.saveReset"), 3200); saveNote = true; }
      // E3: opened on a special night — say so (after any save note)
      if (isNight) announceTonight(saveNote ? 3800 : 700);
    }, 200);
  }

  // ===============================================================
  // 13. Animation loop
  // ===============================================================
  // Same radial edge fade as the ocean, for the lit meshes that reach the edge
  // ring (the snow sheet and the outermost mountains). It fades alpha rather
  // than mixing to the fog colour, so the real sky shows through — a flat fog
  // colour doesn't match the sky behind a high camera and reads as a pale slab.
  function addEdgeFade(shader) {
    shader.vertexShader = "varying vec3 vEdgeWorld;\n" + shader.vertexShader.replace(
      "#include <project_vertex>",
      "#include <project_vertex>\n  vEdgeWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;"
    );
    shader.fragmentShader = "varying vec3 vEdgeWorld;\n" + shader.fragmentShader.replace(
      "#include <fog_fragment>",
      "#include <fog_fragment>\n  gl_FragColor.a *= 1.0 - smoothstep(" +
        EDGE_FADE_START.toFixed(1) + ", " + EDGE_FADE_END.toFixed(1) + ", length(vEdgeWorld.xz));"
    );
  }
  scene.updateMatrixWorld(true);
  var edgeSphere = new THREE.Sphere();
  scene.traverse(function (obj) {
    if (!obj.isMesh || !obj.material || !obj.material.isMeshStandardMaterial) return;
    if (!obj.geometry.boundingSphere) obj.geometry.computeBoundingSphere();
    edgeSphere.copy(obj.geometry.boundingSphere).applyMatrix4(obj.matrixWorld);
    if (Math.hypot(edgeSphere.center.x, edgeSphere.center.z) + edgeSphere.radius < EDGE_FADE_START) return;
    obj.material.onBeforeCompile = addEdgeFade;
    obj.material.transparent = true;
    // draw before ponds/lava/aurora so their blending lands on the snow, not the sky
    obj.renderOrder = obj === ground ? -2 : -1;
  });

  var clock = new THREE.Clock();
  var frameCount = 0;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var elapsed = clock.getElapsedTime();

    auroraUniforms.uTime.value = elapsed;
    oceanUniforms.uTime.value = elapsed;
    oceanUniforms.uWind.value = currentWind01;
    oceanUniforms.uDim.value = THREE.MathUtils.lerp(1.0, 0.4, dayNight.current);
    updateSkyClock(dt);
    updateDayNight(dt);
    updatePuffins(dt, currentWind01, elapsed);
    updateFish(dt, elapsed);
    updatePondRespawns(performance.now());
    updateFood(dt);
    updateSnow(dt, currentWind01);
    updateFloes(elapsed, currentWind01);
    updateWhales(dt, elapsed, currentWind01);
    updateVisitors(dt, elapsed);
    updateParticles(dt);
    updateMeteors(dt, dayNight.current);
    updateVolcano(dt, elapsed, currentWind01, dayNight.current);
    updateCompanions(dt, elapsed);

    updateCamera(dt);
    controls.update();
    var tdx = controls.target.x, tdz = controls.target.z;
    var tdist = Math.sqrt(tdx * tdx + tdz * tdz);
    var maxTargetDist = 150;
    if (tdist > maxTargetDist) {
      var pull = maxTargetDist / tdist;
      controls.target.x *= pull;
      controls.target.z *= pull;
    }

    // hard floor: never let the camera sink below the land or sea surface —
    // orbiting to a steep angle would otherwise flip it underneath the world,
    // looking straight up at nothing
    // (also above any mountain cone, since following a puffin can carry the camera over one)
    var floorY = Math.max(
      groundHeight(camera.position.x, camera.position.z),
      oceanSurfaceY(camera.position.x, camera.position.z, elapsed, currentWind01),
      mountainHeightAt(camera.position.x, camera.position.z)
    ) + 0.6;
    if (camera.position.y < floorY) camera.position.y = floorY;
    updateMoonLook(dayNight.current); // after the camera has moved, so the moon never lags a frame

    renderer.render(scene, camera);

    frameCount++;
    if (frameCount === 3) finishLoading();
  }
  animate();
})();
</script>
</body>
</html>
