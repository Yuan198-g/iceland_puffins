<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极夜海雀 · Aurora Puffins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --aurora: #6EE7B7;
    --aurora-deep: #34D399;
    --ink: #EAF2F6;
    --ink-soft: #A9C0CC;
    --panel-bg: rgba(10, 18, 34, 0.55);
    --panel-border: rgba(234, 242, 246, 0.14);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background:#0B1230;
  }
  #canvas-wrap{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    background: linear-gradient(180deg,#0B1230 0%, #142042 55%, #0E1730 100%);
    z-index: 50; transition: opacity .6s ease;
  }
  #loading .mark{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:21px; color:var(--ink);
    letter-spacing:.02em;
  }
  #loading .bar{ width:180px; height:3px; background:rgba(234,242,246,.14); border-radius:2px; overflow:hidden; }
  #loading .bar-fill{ height:100%; width:0%; background:var(--aurora); transition:width .25s ease; }
  #loading.hide{ opacity:0; pointer-events:none; }

  .hud{ position:fixed; z-index:10; font-family:'Noto Sans SC', sans-serif; color:var(--ink); text-shadow: 0 1px 3px rgba(6,12,30,.55), 0 1px 12px rgba(6,12,30,.35); }

  #title-block{ top:28px; left:32px; }
  #title-block .eyebrow{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px;
    color:var(--ink); letter-spacing:.01em;
  }
  #title-block .sub{
    margin-top:4px; font-size:12.5px; color:var(--ink-soft); max-width:320px; line-height:1.5;
  }

  #hint{
    bottom:26px; left:32px; font-size:12px; color:var(--ink-soft);
    display:flex; gap:16px; flex-wrap:wrap; max-width:min(60vw, calc(100vw - 400px));
  }
  #hint span{ white-space:nowrap; }
  #hint b{ color:var(--ink); font-weight:600; }

  #panel{
    bottom:24px; right:28px;
    background:var(--panel-bg); backdrop-filter: blur(12px);
    border:1px solid var(--panel-border);
    border-radius:16px; padding:14px 18px;
    display:flex; align-items:center; gap:18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  .ctrl{ display:flex; align-items:center; gap:10px; }
  .ctrl-label{ font-size:11px; color:var(--ink-soft); letter-spacing:.04em; white-space:nowrap; }
  #windRange{
    -webkit-appearance:none; width:110px; height:4px; border-radius:2px;
    background: linear-gradient(90deg, var(--aurora) 0%, var(--aurora) var(--fill,20%), rgba(234,242,246,.18) var(--fill,20%));
    outline:none;
  }
  #windRange::-webkit-slider-thumb{
    -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:#fff; border:2.5px solid var(--aurora-deep); cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  #windRange::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background:#fff; border:2.5px solid var(--aurora-deep); cursor:pointer;
  }
  #windText{ font-size:12.5px; font-weight:500; color:var(--ink); min-width:34px; }

  #langToggle{
    font-family:'Space Grotesk', 'Noto Sans SC', sans-serif; font-size:12px; font-weight:700;
    color:var(--ink); background:rgba(234,242,246,.08); border:1px solid var(--panel-border);
    border-radius:999px; padding:6px 11px; cursor:pointer; letter-spacing:.04em;
    transition: background .2s ease;
  }
  #langToggle:hover{ background:rgba(234,242,246,.16); }
  #langToggle:focus-visible{ outline:2px solid var(--aurora); outline-offset:2px; }

  #dayToggle{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    background:rgba(234,242,246,.08); border-radius:999px; padding:7px 13px 7px 10px;
    border:1px solid transparent; transition: background .2s ease;
    user-select:none;
  }
  #dayToggle:hover{ background:rgba(234,242,246,.14); }
  #dayToggle .dot{
    width:9px; height:9px; border-radius:50%; background:#FDE68A;
    box-shadow:0 0 6px rgba(253,230,138,.8);
    transition: background .4s ease, box-shadow .4s ease;
  }
  #dayToggle.night .dot{ background:var(--aurora); box-shadow:0 0 6px rgba(110,231,183,.9); }
  #dayToggle span.txt{ font-size:12.5px; color:var(--ink); }
  #dayToggle:focus-visible{ outline:2px solid var(--aurora); outline-offset:2px; }
  /* E3: a small clock while the sky follows the player's local time */
  #dayToggle .auto-ico{ width:12px; height:12px; color:var(--ink-soft); flex:none; }
  #dayToggle.manual .auto-ico{ display:none; }

  #toast{
    position:fixed; z-index:10; left:50%; top:34px; transform:translateX(-50%) translateY(-12px);
    background:var(--panel-bg); backdrop-filter:blur(8px); border:1px solid var(--panel-border);
    padding:8px 16px; border-radius:999px; font-size:12.5px; color:var(--ink);
    opacity:0; transition: opacity .35s ease, transform .35s ease; pointer-events:none;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast{ z-index:30; }

  /* ---- E1: adoption & companionship ---- */
  [hidden]{ display:none !important; }
  .glass{
    background:var(--panel-bg); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--panel-border); box-shadow:0 8px 28px rgba(0,0,0,.35);
    text-shadow:none;
  }
  .pill-btn{
    font:600 12px/1 'Noto Sans SC', sans-serif; color:var(--ink);
    background:rgba(234,242,246,.08); border:1px solid var(--panel-border);
    border-radius:999px; padding:8px 13px; cursor:pointer; transition:background .2s ease, opacity .2s ease;
  }
  .pill-btn:hover:not(:disabled){ background:rgba(234,242,246,.16); }
  .pill-btn:focus-visible{ outline:2px solid var(--aurora); outline-offset:2px; }
  .pill-btn:disabled{ opacity:.42; cursor:not-allowed; }
  .pill-btn.primary{ background:var(--aurora); border-color:transparent; color:#0B1230; }
  .pill-btn.primary:hover:not(:disabled){ background:#8BF0C8; }
  .pill-btn[aria-pressed="true"]{ background:rgba(110,231,183,.22); border-color:rgba(110,231,183,.55); color:var(--aurora); }

  #topRight{ position:fixed; z-index:12; top:24px; right:28px; display:flex; gap:8px; align-items:center; }
  .top-pill{
    display:flex; align-items:center; gap:8px; padding:9px 14px;
    border-radius:999px; cursor:pointer; color:var(--ink);
    font:600 12.5px/1 'Noto Sans SC', sans-serif;
  }
  .top-pill .count{
    font-family:'Space Grotesk', 'Noto Sans SC', sans-serif; font-size:11px; color:var(--aurora);
    background:rgba(110,231,183,.14); border-radius:999px; padding:3px 7px;
  }
  #chickBtn .count{ color:#FDE68A; background:rgba(253,230,138,.14); }
  .top-pill .ico{ font-size:13px; line-height:1; }
  .top-pill .chev{ font-size:10px; color:var(--ink-soft); transition:transform .2s ease; }
  .top-pill[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .top-pill:focus-visible{ outline:2px solid var(--aurora); outline-offset:2px; }

  #chickPanel{
    position:fixed; z-index:13; top:68px; right:28px; width:300px;
    border-radius:16px; padding:14px 16px 16px; color:var(--ink);
    max-height:calc(100vh - 200px); overflow:auto;
  }
  .cp-title{ font:700 15px/1.3 'Space Grotesk', 'Noto Sans SC', sans-serif; margin:0 0 6px; }
  #chickForm{ margin-top:10px; }
  #chickForm label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  #chickNameInput{
    width:100%; font:500 14px 'Noto Sans SC', sans-serif; color:var(--ink);
    background:rgba(6,12,30,.45); border:1px solid var(--panel-border); border-radius:10px; padding:9px 11px;
  }
  #chickNameInput:focus{ outline:2px solid var(--aurora); outline-offset:1px; }
  .cp-growth{ display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12.5px; color:var(--ink-soft); }
  .cp-growth .pc-bar{ flex:1; }

  /* growth is warm yellow; affinity stays aurora green */
  .pc-bar.growth i{ background:#FDE68A; }
  .pc-chip.growth{ background:rgba(253,230,138,.16); color:#FDE68A; }
  .pc-growth{ margin-top:14px; padding-top:12px; border-top:1px solid var(--panel-border); }
  .pc-sub{ font:700 12px/1 'Noto Sans SC', sans-serif; letter-spacing:.06em; color:#FDE68A; margin:0 0 2px; }
  .pill-btn.growth-btn{ background:rgba(253,230,138,.16); border-color:rgba(253,230,138,.4); color:#FDE68A; }
  .pill-btn.growth-btn:hover:not(:disabled){ background:rgba(253,230,138,.26); }
  #pcJournal{ margin-top:12px; }
  #pcJournal summary{ cursor:pointer; font-size:12px; color:var(--ink-soft); list-style-position:inside; }
  #pcJournal summary:focus-visible{ outline:2px solid var(--aurora); outline-offset:2px; border-radius:4px; }
  .journal{ list-style:none; margin:8px 0 0; padding:0; }
  .journal li{ display:flex; gap:9px; align-items:flex-start; padding:6px 0; font-size:12px; line-height:1.45; }
  .journal li + li{ border-top:1px dashed rgba(234,242,246,.1); }
  .journal .ji{ flex:none; width:18px; text-align:center; }
  .journal .jt{ flex:1; color:var(--ink); }
  .journal .jd{ flex:none; color:var(--ink-soft); font-size:11px; white-space:nowrap; }

  #companionList{
    position:fixed; z-index:13; top:68px; right:28px; width:280px;
    border-radius:14px; padding:8px; color:var(--ink);
    max-height:calc(100vh - 200px); overflow:auto;
  }
  #companionList .empty{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:6px 8px; }
  .cl-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:0; border-radius:10px; padding:9px 10px; cursor:pointer; color:var(--ink);
    font:inherit;
  }
  .cl-item:hover, .cl-item:focus-visible{ background:rgba(234,242,246,.09); outline:none; }
  .cl-item .nm{ flex:1; min-width:0; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cl-item .st{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }
  .mini-bar{ width:44px; height:4px; border-radius:2px; background:rgba(234,242,246,.14); overflow:hidden; flex:none; }
  .mini-bar i{ display:block; height:100%; background:var(--aurora); }

  #puffinCard{
    position:fixed; z-index:12; top:72px; right:28px; width:300px;
    border-radius:16px; padding:14px 16px 16px; color:var(--ink);
    max-height:calc(100vh - 190px); overflow:auto;
  }
  .pc-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .pc-title{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; min-width:0; }
  .pc-name{
    font:700 17px/1.3 'Space Grotesk', 'Noto Sans SC', sans-serif; color:var(--ink);
    overflow-wrap:anywhere;
  }
  .pc-chip{
    font-size:11px; padding:3px 8px; border-radius:999px; white-space:nowrap;
    background:rgba(234,242,246,.1); color:var(--ink-soft);
  }
  .pc-chip.lively{ background:rgba(253,230,138,.16); color:#FDE68A; }
  .pc-chip.easygoing{ background:rgba(110,231,183,.14); color:var(--aurora); }
  .pc-chip.timid{ background:rgba(167,139,250,.18); color:#C4B5FD; }
  .pc-x{
    flex:none; width:28px; height:28px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(234,242,246,.08); color:var(--ink); font-size:16px; line-height:28px;
  }
  .pc-x:hover{ background:rgba(234,242,246,.16); }
  .pc-x:focus-visible{ outline:2px solid var(--aurora); outline-offset:2px; }
  .pc-rows{ margin:12px 0 8px; }
  .pc-rows > div{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 0; font-size:12.5px; }
  .pc-rows dt{ color:var(--ink-soft); white-space:nowrap; }
  #pcAffText{ white-space:nowrap; }
  .pc-rows dd{ margin:0; text-align:right; display:flex; align-items:center; gap:8px; }
  .pc-bar{ width:70px; height:5px; border-radius:3px; background:rgba(234,242,246,.14); overflow:hidden; }
  .pc-bar i{ display:block; height:100%; width:0; background:var(--aurora); transition:width .4s ease; }
  .pc-note{ font-size:11.5px; line-height:1.55; color:var(--ink-soft); margin:4px 0 0; }
  .pc-note.warn{ color:#FCD34D; }
  .pc-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  #pcNameForm{ margin-top:12px; }
  #pcNameForm label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  #pcNameInput{
    width:100%; font:500 14px 'Noto Sans SC', sans-serif; color:var(--ink);
    background:rgba(6,12,30,.45); border:1px solid var(--panel-border); border-radius:10px; padding:9px 11px;
  }
  #pcNameInput:focus{ outline:2px solid var(--aurora); outline-offset:1px; }
  .pc-err{ font-size:11.5px; color:#FCA5A5; min-height:1em; margin:6px 0 0; }

  @media (max-width: 640px){
    #title-block .sub{ display:none; }
    #hint{ max-width:calc(100vw - 32px); font-size:10.5px; gap:10px; left:16px; bottom:84px; }
    #panel{ padding:10px 12px; gap:12px; right:16px; }
    #windRange{ width:70px; }
    #topRight{ top:16px; right:16px; gap:6px; }
    .top-pill{ padding:8px 11px; }
    #chickBtn .lbl{ display:none; } /* icon + stage chip is enough on a phone */
    #companionList{ top:58px; right:12px; left:12px; width:auto; }
    #chickPanel{ top:58px; left:12px; right:12px; width:auto; max-height:calc(100vh - 230px); }
    #puffinCard{ top:58px; left:12px; right:12px; width:auto; max-height:calc(100vh - 230px); padding:12px 14px 14px; }
    .cl-item{ padding:13px 10px; }
    #puffinCard .pill-btn{ padding:11px 15px; font-size:13px; }
    #toast{ top:62px; max-width:calc(100vw - 32px); text-align:center; }
  }
  @media (max-width: 360px){
    /* the smallest phones: drop the "wind" label so the panel still fits */
    #panel .ctrl-label{ display:none; }
    #windRange{ width:56px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="mark" data-i18n="appName">极夜海雀</div>
  <div class="bar"><div class="bar-fill" id="loadBar"></div></div>
</div>

<div id="canvas-wrap"></div>

<div class="hud" id="title-block">
  <div class="eyebrow" data-i18n="appName">极夜海雀</div>
  <div class="sub" data-i18n="tagline">风从冰原上刮过,Puffins站在雪地里,远处的海面偶尔有鲸鱼浮出来...</div>
</div>

<div class="hud" id="hint">
  <span data-i18n-html="hint.ground"><b>点地面</b> 喂食</span>
  <span data-i18n-html="hint.puffin"><b>点海雀</b> 翻跟头、打开它的卡片</span>
  <span data-i18n-html="hint.fish"><b>点湖里的鱼</b> 吓它跳上岸</span>
  <span data-i18n-html="hint.whale"><b>点鲸鱼</b> 喷水(会变小)</span>
  <span data-i18n-html="hint.sea"><b>点海面</b> 投喂(它会变大)</span>
  <span data-i18n-html="hint.volcano"><b>点火山</b> 冒白烟时会喷发</span>
  <span data-i18n-html="hint.drag"><b>拖动</b> 旋转视角</span>
  <span data-i18n-html="hint.pan"><b>右键/双指</b> 平移</span>
  <span data-i18n-html="hint.zoom"><b>滚轮</b> 缩放</span>
</div>

<div class="hud" id="panel">
  <div class="ctrl">
    <span class="ctrl-label" data-i18n="wind">风力</span>
    <input type="range" id="windRange" min="0" max="100" value="24">
    <span id="windText">微风</span>
  </div>
  <div id="dayToggle" role="button" tabindex="0">
    <span class="dot"></span>
    <span class="txt" id="dayToggleText">白昼</span>
    <svg class="auto-ico" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.7" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3.5V6l1.7 1.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </div>
  <button type="button" id="langToggle" aria-label="Switch language">EN</button>
</div>

<div class="hud" id="toast" role="status" aria-live="polite"></div>

<div id="topRight">
  <button type="button" id="chickBtn" class="glass top-pill" aria-expanded="false" aria-controls="chickPanel">
    <span class="ico" aria-hidden="true">🐣</span>
    <span class="lbl" id="chickBtnText">领养幼鸟</span>
    <span class="count" id="chickBtnStage" hidden></span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  <button type="button" id="companionBtn" class="glass top-pill" aria-expanded="false" aria-controls="companionList">
    <span data-i18n="companion.button">我的海雀</span>
    <span class="count" id="companionCount">0/3</span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
</div>
<div id="companionList" class="glass" hidden></div>

<section id="chickPanel" class="glass" hidden aria-labelledby="chickPanelTitle">
  <div id="chickAdoptView">
    <h2 id="chickPanelTitle" class="cp-title" data-i18n="chick.title">领养一只幼鸟</h2>
    <p class="pc-note" data-i18n="chick.intro"></p>
    <form id="chickForm" novalidate>
      <label for="chickNameInput" data-i18n="chick.nameLabel">给它起个名字</label>
      <input id="chickNameInput" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      <p id="chickNameErr" class="pc-err" aria-live="polite"></p>
      <div class="pc-actions"><button type="submit" class="pill-btn primary" data-i18n="chick.adoptBtn">领养</button></div>
    </form>
  </div>
  <div id="chickOwnedView" hidden>
    <div class="pc-head">
      <div class="pc-title"><h2 id="chickOwnedName" class="pc-name"></h2><span id="chickOwnedStage" class="pc-chip growth"></span></div>
    </div>
    <div class="cp-growth"><span class="pc-bar growth"><i id="chickOwnedFill"></i></span><span id="chickOwnedText"></span></div>
    <div class="pc-actions"><button type="button" id="chickViewBtn" class="pill-btn primary" data-i18n="chick.view">查看并定位</button></div>
  </div>
</section>

<section id="puffinCard" class="glass" hidden aria-labelledby="pcName">
  <div class="pc-head">
    <div class="pc-title">
      <h2 id="pcName" class="pc-name"></h2>
      <span id="pcPersona" class="pc-chip"></span>
    </div>
    <button type="button" id="pcClose" class="pc-x" aria-label="关闭">×</button>
  </div>
  <dl class="pc-rows">
    <div><dt data-i18n="card.state">状态</dt><dd id="pcState"></dd></div>
    <div><dt data-i18n="card.adoption">认养</dt><dd id="pcAdopted"></dd></div>
    <div id="pcAffRow"><dt data-i18n="card.affinity">亲密度</dt><dd><span class="pc-bar"><i id="pcBarFill"></i></span><span id="pcAffText"></span></dd></div>
  </dl>
  <p id="pcReward" class="pc-note"></p>
  <p id="pcPetNote" class="pc-note" hidden></p>
  <form id="pcNameForm" hidden novalidate>
    <label for="pcNameInput" id="pcNameLabel"></label>
    <input id="pcNameInput" type="text" maxlength="40" autocomplete="off" spellcheck="false">
    <p id="pcNameErr" class="pc-err" aria-live="polite"></p>
    <div class="pc-actions">
      <button type="submit" id="pcNameOk" class="pill-btn primary"></button>
      <button type="button" id="pcNameCancel" class="pill-btn" data-i18n="card.cancel">取消</button>
    </div>
  </form>
  <div class="pc-actions" id="pcActions">
    <button type="button" id="pcAdopt" class="pill-btn primary" data-i18n="card.adopt">认养</button>
    <button type="button" id="pcRename" class="pill-btn" data-i18n="card.rename">改名</button>
    <button type="button" id="pcPet" class="pill-btn" data-i18n="card.pet">抚摸</button>
    <button type="button" id="pcLocate" class="pill-btn" data-i18n="card.locate">定位</button>
    <button type="button" id="pcFollow" class="pill-btn" aria-pressed="false"></button>
  </div>
  <p id="pcLimitNote" class="pc-note warn" hidden></p>
  <div id="pcGrowth" class="pc-growth" hidden>
    <h3 class="pc-sub" data-i18n="growth.section">成长</h3>
    <dl class="pc-rows">
      <div><dt data-i18n="growth.stageLabel">成长阶段</dt><dd id="pcGrowthStage"></dd></div>

  // The coastline is a jagged noise curve along X, not a straight line — reads

  var WORLD_HALF_WIDTH = 220;  // world spans X: -220..220 (mesh + fog only, keeps the edge out of reach)
  var LAND_FAR_Z = 220;        // land's north edge (mesh only)
  var OCEAN_FAR_Z = -230;      // ocean's south edge (mesh only)
  var WORLD_RADIUS = 220;      // kept for snowfall spread sizing

  // Where gameplay content (puffins, ponds, rocks, whales, floes, mountains)
  // actually lives — deliberately much smaller than the mesh extents above, so
  // the scene stays cozy instead of everything scattering across 220 units.
  var PLAY_HALF_WIDTH = 120;
  var PLAY_LAND_FAR_Z = 120;
  var PLAY_OCEAN_FAR_Z = -138;

  // The meshes are rectangles; everything melts into the horizon/fog colour
  // along a circle between these radii, so from high up the world edge reads
  // as a soft round horizon instead of a hard square border.
  var EDGE_FADE_START = 175, EDGE_FADE_END = 218;

  function coastlineZ(x) {
    return Math.sin(x * 0.12) * 3.2 + Math.sin(x * 0.05 + 1.3) * 2.4 + Math.cos(x * 0.3) * 0.8;
  }

  function groundHeight(x, z) {
    return (

      Math.sin(x * 0.28 + z * 0.19) * 0.09
    );
  }

  // A safe land point: north of the coast with a buffer, inside the world width.
  function randomLandPoint(minZ, maxZ) {
    var x = (Math.random() - 0.5) * (PLAY_HALF_WIDTH - 6) * 2;
    var lo = Math.max(minZ, coastlineZ(x) + 6);
    var z = lo + Math.random() * Math.max(1, maxZ - lo);
    return { x: x, z: z };
  }
  // A safe sea point: south of the coast with a buffer.
  function randomSeaPoint(minZ, maxZ) {
    var x = (Math.random() - 0.5) * (PLAY_HALF_WIDTH - 4) * 2;
    var hi = Math.min(maxZ, coastlineZ(x) - 6);
    var z = minZ + Math.random() * Math.max(1, hi - minZ);
    return { x: x, z: z };
  }

  // Grid mesh spanning from the coastline out to farZ. Handles both directions —
  // land grows toward +Z, ocean toward -Z — with matching winding either way,
  // verified numerically before shipping (going the other direction flips which
  // triangle order faces up, easy to get backwards by hand).
  function makeBandGeometry(xMin, xMax, xSegs, zSegs, coastFn, farZ) {
    var geo = new THREE.BufferGeometry();
    var positions = [];
    for (var xi = 0; xi <= xSegs; xi++) {
      var x = xMin + (xMax - xMin) * (xi / xSegs);
      var edgeZ = coastFn(x);
      for (var zi = 0; zi <= zSegs; zi++) {
        var t = zi / zSegs;
        var z = edgeZ + (farZ - edgeZ) * t;
        positions.push(x, 0, z);
      }
    }
    var flip = farZ < 0;
    var indices = [];
    var stride = zSegs + 1;
    for (var xi2 = 0; xi2 < xSegs; xi2++) {
      for (var zi2 = 0; zi2 < zSegs; zi2++) {
        var i00 = xi2 * stride + zi2, i01 = xi2 * stride + zi2 + 1;
        var i10 = (xi2 + 1) * stride + zi2, i11 = (xi2 + 1) * stride + zi2 + 1;
        if (!flip) {
          indices.push(i00, i11, i10);
          indices.push(i00, i01, i11);
        } else {
          indices.push(i00, i10, i11);
          indices.push(i00, i11, i01);
        }
      }
    }
    geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    return geo;
  }

  // ===============================================================
  // 1. Sky dome (polar day <-> polar night gradient)
  // ===============================================================
  var skyPalette = {
    day: { top: new THREE.Color("#8FB9DE"), bottom: new THREE.Color("#DCEBF2") },
    night: { top: new THREE.Color("#050914"), bottom: new THREE.Color("#111A38") }
  };
  var skyUniforms = {
    topColor: { value: skyPalette.day.top.clone() },
    bottomColor: { value: skyPalette.day.bottom.clone() },
    offset: { value: 6 },
    exponent: { value: 0.68 }
  };
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(160, 24, 16),
    new THREE.ShaderMaterial({
      uniforms: skyUniforms,
      side: THREE.BackSide,
      depthWrite: false,
      vertexShader: [
        "varying vec3 vWorldPos;",
        "void main(){",
        "  vec4 wp = modelMatrix * vec4(position, 1.0);",
        "  vWorldPos = wp.xyz;",
        "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
        "}"
      ].join("\n"),
      fragmentShader: [
        "uniform vec3 topColor;", "uniform vec3 bottomColor;",
        "uniform float offset;", "uniform float exponent;",
        "varying vec3 vWorldPos;",
        "void main(){",
        "  float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;",
        "  float t = clamp(pow(max(h, 0.0), exponent), 0.0, 1.0);",
        "  gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);",
        "}"
      ].join("\n")
    })
  );
  scene.add(sky);
  scene.fog = new THREE.Fog(skyPalette.day.bottom.getHex(), 70, 200);

  // ===============================================================
  // 2. Aurora dome (visible mainly at night) — a full sphere around the
  //    world, colored by direction (azimuth + elevation), so it covers the
  //    whole sky rather than reading as one horizontal ribbon
  // ===============================================================
  var auroraUniforms = {
    uTime: { value: 0 },
    uNight: { value: 0 },
    uColorA: { value: new THREE.Color("#34D399") },
    uColorB: { value: new THREE.Color("#22D3EE") },
    uColorC: { value: new THREE.Color("#A78BFA") }
  };
  var auroraGeo = new THREE.SphereGeometry(150, 64, 40);
  var auroraMat = new THREE.ShaderMaterial({
    uniforms: auroraUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    vertexShader: [
      "varying vec3 vDir;",
      "void main(){",
      "  vDir = normalize(position);",
      "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform float uTime; uniform float uNight;",
      "uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;",
      "varying vec3 vDir;",
      "void main(){",
      "  float az = atan(vDir.x, vDir.z);",
      "  float el = vDir.y;",
      "  float n1 = sin(az*3.0 + el*4.0 + uTime*0.55) * 0.5 + 0.5;",
      "  float n2 = sin(az*5.0 - el*3.0 - uTime*0.8) * 0.5 + 0.5;",
      "  float band = smoothstep(0.15, 0.95, n1*0.6 + n2*0.4);",
      "  vec3 col = mix(uColorA, uColorB, sin(az*2.0 + uTime*0.3)*0.5+0.5);",
      "  col = mix(col, uColorC, n2*0.35);",
      "  col *= mix(1.0, 1.1, uNight);",
      "  float envelope = smoothstep(0.02, 0.32, el) * mix(1.0, 0.55, smoothstep(0.7, 1.0, el));",
      "  float alpha = band * envelope * uNight * 0.9;",
      "  gl_FragColor = vec4(col, alpha);",
      "}"
    ].join("\n")
  });
  var aurora = new THREE.Mesh(auroraGeo, auroraMat);
  scene.add(aurora);

  // ===============================================================
  // 3. Stars (fade in at night)
  // ===============================================================
  var starCount = 500;
  var starPos = new Float32Array(starCount * 3);
  for (var s = 0; s < starCount; s++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.random() * Math.PI * 0.42 + 0.06;
    var r = 140;
    starPos[s * 3] = r * Math.sin(phi) * Math.cos(theta);
    starPos[s * 3 + 1] = r * Math.cos(phi) + 10;
    starPos[s * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, transparent: true, opacity: 0 });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // ===============================================================
  // 3a. E3 — the real sky: the player's local clock, tonight's moon phase
  //     and the big meteor-shower nights. Pure date maths, no scene.
  // ===============================================================
  // ---- E3 sky calendar ----
  var SKY_CLOCK = { DAY_FROM: 7, NIGHT_FROM: 19 }; // local hours: polar night runs 19:00–07:00
  var DUSK_FADE_SPEED = 0.05;                      // a clock-driven dusk or dawn takes ~20 s
  // a shower night is named by the evening it starts (Perseids peak on the
  // night of Aug 12–13, Geminids on Dec 13–14); radiant = direction its
  // meteors fly away from (north is +z, east is -x)
  var METEOR_SHOWERS = [
    { key: "perseids", month: 8, day: 12, radiant: [-0.5, 0.7, 0.5] },
    { key: "geminids", month: 12, day: 13, radiant: [-0.7, 0.7, 0.1] }
  ];
  var SHOWER_FALLOFF = [1, 0.45, 0.18]; // strength on the peak night, ±1 night, ±2 nights
  var SHOWER_RATE = 5;                  // peak night: (1 + 5)× the usual meteors
  var FULL_MOON_DAYS = 1.2;             // counts as full within this many days of the exact moment
  var SYNODIC_DAYS = 29.530588853;

  function clockSaysNight(d) {
    var h = d.getHours() + d.getMinutes() / 60;
    return h >= SKY_CLOCK.NIGHT_FROM || h < SKY_CLOCK.DAY_FROM;
  }
  // the evening a night belongs to: 02:00 on the 13th is still the night of the 12th
  function nightOf(d) {
    var e = new Date(d.getTime() - 12 * 3600000);
    return new Date(e.getFullYear(), e.getMonth(), e.getDate());
  }
  // the strongest shower around tonight, or null
  function showerTonight(d) {
    var night = nightOf(d), best = null;
    METEOR_SHOWERS.forEach(function (s) {
      for (var dy = -1; dy <= 1; dy++) { // a peak near New Year can sit in the next/previous year
        var peak = new Date(night.getFullYear() + dy, s.month - 1, s.day);
        var off = Math.round(Math.abs(night.getTime() - peak.getTime()) / 86400000);
        if (off < SHOWER_FALLOFF.length && (!best || SHOWER_FALLOFF[off] > best.strength)) {
          best = { key: s.key, radiant: s.radiant, strength: SHOWER_FALLOFF[off], peak: off === 0 };
        }
      }
    });
    return best;
  }
  // 0 new, 0.25 first quarter, 0.5 full, 0.75 last quarter. The true moon–sun
  // elongation from the main lunar terms (Meeus) — within about an hour of
  // the real phase, which is plenty for drawing it.
  function moonPhase(ms) {
    var R = Math.PI / 180;
    var T = (ms / 86400000 + 2440587.5 - 2451545) / 36525;
    var D = 297.8501921 + 445267.1114034 * T;
    var M = 357.5291092 + 35999.0502909 * T;
    var Mp = 134.9633964 + 477198.8675055 * T;
    var E = D + 6.289 * Math.sin(Mp * R) - 2.1 * Math.sin(M * R) + 1.274 * Math.sin((2 * D - Mp) * R) +
      0.658 * Math.sin(2 * D * R) + 0.214 * Math.sin(2 * Mp * R) + 0.11 * Math.sin(D * R);
    return (((E % 360) + 360) % 360) / 360;
  }
  function moonIllumination(phase) { return (1 - Math.cos(2 * Math.PI * phase)) / 2; }
  function isFullMoon(phase) { return Math.abs(phase - 0.5) * SYNODIC_DAYS < FULL_MOON_DAYS; }

  // Preview another night without waiting for it: ?date=YYYY-MM-DD and/or
  // ?time=HH:MM shift the *sky* clock (it keeps running from there), and
  // ?visitor=fox|owl|orca brings that visitor by right away. Saves,
  // cooldowns and daily caps always use the real clock.
  function parseSkyPreview(search, now) {
    var out = { offsetMs: 0, visitor: null };
    var q;
    try { q = new URLSearchParams(search || ""); } catch (e) { return out; }
    var target = new Date(now.getTime()), changed = false;
    var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(q.get("date") || "");
    if (dm) {
      var y = +dm[1], mo = +dm[2] - 1, dd = +dm[3];
      var probe = new Date(y, mo, dd);
      if (probe.getFullYear() === y && probe.getMonth() === mo && probe.getDate() === dd) {
        target.setFullYear(y, mo, dd);
        changed = true;
      }
    }
    var tm = /^(\d{1,2}):(\d{2})$/.exec(q.get("time") || "");
    if (tm && +tm[1] < 24 && +tm[2] < 60) { target.setHours(+tm[1], +tm[2], 0, 0); changed = true; }
    if (changed) out.offsetMs = target.getTime() - now.getTime();
    if (/^(fox|owl|orca)$/.test(q.get("visitor") || "")) out.visitor = q.get("visitor");
    return out;
  }
  // ---- end sky calendar ----
  var skyPreview = parseSkyPreview(window.location.search, new Date());
  function skyNow() { return new Date(Date.now() + skyPreview.offsetMs); }
  var activeShower = null; // refreshed once a second by the sky clock (section 11)

  // ===============================================================
  // 3b. Shooting stars — a hair-thin green streak with a glowing head that
  //     flares ("pops") as it burns out. Only while it's mostly night.
  // ===============================================================
  var meteors = [];
  var meteorTimer = 5 + Math.random() * 6;
  var METEOR_TRAVEL = 0.78; // fraction of life spent moving; the rest is the end flare

  var meteorGlowTex = (function () {
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, "rgba(255,255,255,1)");
    grad.addColorStop(0.25, "rgba(255,255,255,0.7)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  function makeGlowPoint(color, size) {
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0], 3));
    var mat = new THREE.PointsMaterial({
      color: color, size: size, sizeAttenuation: false, map: meteorGlowTex,
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
    });
    return new THREE.Points(geo, mat);
  }

  function skyPoint(r, theta, phi) {
    return new THREE.Vector3(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi) + 10,
      r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // E3: a random point in the sky the camera can actually see right now
  // (the orbit camera never tilts above level, so that's the lower sky in
  // front of it), on the meteor sphere; null if the view shows no sky
  function skyPointInView(r, center) {
    var oc = camera.position.clone().sub(center);
    for (var i = 0; i < 6; i++) {
      var d = new THREE.Vector3((Math.random() - 0.5) * 1.8, Math.random() * 0.9, 0.5).unproject(camera).sub(camera.position).normalize();
      if (d.y < 0.08) continue; // that part of the view is ground or sea
      var b = oc.dot(d), disc = b * b - (oc.lengthSq() - r * r);
      if (disc < 0) continue;
      return camera.position.clone().addScaledVector(d, -b + Math.sqrt(disc));
    }
    return null;
  }

  function spawnMeteor(radiant) {
    var theta = Math.random() * Math.PI * 2;
    var phi = 0.25 + Math.random() * 0.85; // wide band from near-overhead to near-horizon — where the orbit camera actually looks
    var r = 115;
    var start = skyPoint(r, theta, phi);
    var end;
    if (radiant) {
      // E3 shower meteor: always flying straight away from the shower's
      // radiant, so on a big night they all fan out from one point. Most of
      // them turn up in the part of the sky the camera is facing — spread
      // over the whole dome, even a peak night looks like a quiet one.
      var center = new THREE.Vector3(0, 10, 0);
      var R = new THREE.Vector3(radiant[0], radiant[1], radiant[2]).normalize();
      var sHat, cosA = 1;
      for (var tries = 0; tries < 8 && (cosA > 0.94 || cosA < -0.3); tries++) {
        // not right on top of the radiant (no streak) nor on the far side of the sky
        start = (Math.random() < 0.7 && skyPointInView(r, center)) || skyPoint(r, Math.random() * Math.PI * 2, 0.25 + Math.random() * 0.85);
        sHat = start.clone().sub(center).normalize();
        cosA = sHat.dot(R);
      }
      var away = sHat.clone().multiplyScalar(cosA).sub(R).normalize(); // along the sky, away from the radiant
      end = start.clone().addScaledVector(away, 22 + Math.random() * 18);
    } else {
      end = skyPoint(r, theta + (Math.random() - 0.5) * 0.6, phi + 0.2 + Math.random() * 0.2);
    }
    var dir = new THREE.Vector3().subVectors(end, start);
    var len = dir.length();
    dir.normalize();

    // 1px line; vertex colors fade tail->black, which is invisible under
    // additive blending, so the streak tapers without needing a custom shader
    var trailGeo = new THREE.BufferGeometry();
    trailGeo.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
    var headCol = new THREE.Color("#8CFFB8");
    trailGeo.setAttribute("color", new THREE.Float32BufferAttribute([0, 0, 0, headCol.r, headCol.g, headCol.b], 3));
    var trailMat = new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    var trail = new THREE.Line(trailGeo, trailMat);
    var core = makeGlowPoint("#F0FFF4", 6);
    var halo = makeGlowPoint("#5CFF9A", 14);
    scene.add(trail); scene.add(halo); scene.add(core);

    meteors.push({
      trail: trail, core: core, halo: halo,
      life: 0, maxLife: 0.9 + Math.random() * 0.4,
      start: start, dir: dir, len: len, trailLen: len * (0.35 + Math.random() * 0.15)
    });
  }

  function disposeMeteor(m) {
    [m.trail, m.core, m.halo].forEach(function (o) {
      scene.remove(o);
      o.geometry.dispose();
      o.material.dispose();
    });
  }

  function updateMeteors(dt, nightAmount) {
    meteorTimer -= dt;
    if (nightAmount > 0.5 && meteorTimer <= 0) {
      // E3: on a shower night most meteors belong to the shower, and they come far more often
      var sh = activeShower;
      spawnMeteor(sh && Math.random() < 0.85 ? sh.radiant : null);
      meteorTimer = (4 + Math.random() * 9) / (1 + (sh ? SHOWER_RATE * sh.strength : 0));
    } else if (nightAmount <= 0.5) {
      meteorTimer = Math.max(meteorTimer, 2);
    }
    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.life += dt;
      var t = m.life / m.maxLife;
      if (t >= 1) { disposeMeteor(m); meteors.splice(i, 1); continue; }

      var travel = Math.min(t / METEOR_TRAVEL, 1);
      var headDist = m.len * Math.pow(travel, 1.25); // slight speed-up as it falls
      var head = m.start.clone().addScaledVector(m.dir, headDist);
      var tailDist = Math.max(0, headDist - m.trailLen * Math.min(1, travel * 3));
      var flare = t > METEOR_TRAVEL ? (t - METEOR_TRAVEL) / (1 - METEOR_TRAVEL) : 0;
      if (flare > 0) tailDist = headDist - (headDist - tailDist) * (1 - flare); // trail snaps in toward the flare

      var tail = m.start.clone().addScaledVector(m.dir, tailDist);
      var pos = m.trail.geometry.attributes.position;
      pos.setXYZ(0, tail.x, tail.y, tail.z);
      pos.setXYZ(1, head.x, head.y, head.z);
      pos.needsUpdate = true;
      m.trail.geometry.computeBoundingSphere();

      var fadeIn = Math.min(1, t / 0.06);
      m.trail.material.opacity = fadeIn * (1 - flare);
      m.core.position.copy(head);
      m.halo.position.copy(head);
      if (flare <= 0) {
        m.core.material.opacity = fadeIn;
        m.halo.material.opacity = fadeIn * 0.55;
        m.core.material.size = 5 + travel * 2;
        m.halo.material.size = 12 + travel * 4;
      } else {
        // quick bloom then burn-out
        var pop = flare < 0.22 ? flare / 0.22 : 1 - (flare - 0.22) / 0.78;
        m.core.material.opacity = 1 - Math.pow(flare, 1.6);
        m.halo.material.opacity = 0.8 * (1 - flare);
        m.core.material.size = 7 + pop * 9;
        m.halo.material.size = 16 + pop * 26;
      }
    }
  }

  // ===============================================================
  // 4. Lights, day/night interpolation
  // ===============================================================
  var hemi = new THREE.HemisphereLight(0xbcd6ee, 0xdfe9f2, 1.0);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xfff2df, 1.1);
  sun.position.set(16, 18, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
  sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
  sun.shadow.camera.far = 60; sun.shadow.bias = -0.0025;
  scene.add(sun); scene.add(sun.target);

  var lightPalette = {
    day: {
      hemiSky: new THREE.Color("#BCD6EE"), hemiGround: new THREE.Color("#DFE9F2"), hemiI: 1.0,
      sunColor: new THREE.Color("#FFF2DF"), sunI: 1.1, sunPos: new THREE.Vector3(16, 18, 6)
    },
    night: {
      hemiSky: new THREE.Color("#141C3A"), hemiGround: new THREE.Color("#1E2438"), hemiI: 0.28,
      sunColor: new THREE.Color("#7C9CD8"), sunI: 0.18, sunPos: new THREE.Vector3(-12, 14, -8)
    }
  };
  // speed: a tap switches in ~1 s; the local clock's own dusk/dawn is slower (E3)
  var dayNight = { target: 0, current: 0, speed: 0.85 };

  function updateDayNight(dt) {
    var speed = dayNight.speed;
    if (dayNight.current < dayNight.target) dayNight.current = Math.min(dayNight.target, dayNight.current + dt * speed);
    else if (dayNight.current > dayNight.target) dayNight.current = Math.max(dayNight.target, dayNight.current - dt * speed);
    var t = dayNight.current, d = lightPalette.day, n = lightPalette.night;

    hemi.color.copy(d.hemiSky).lerp(n.hemiSky, t);
    hemi.groundColor.copy(d.hemiGround).lerp(n.hemiGround, t);
    hemi.intensity = THREE.MathUtils.lerp(d.hemiI, n.hemiI, t);
    sun.color.copy(d.sunColor).lerp(n.sunColor, t);
    sun.intensity = THREE.MathUtils.lerp(d.sunI, n.sunI, t);
    sun.position.lerpVectors(d.sunPos, n.sunPos, t);
    sun.target.position.set(0, 0, 0);

    skyUniforms.topColor.value.copy(skyPalette.day.top).lerp(skyPalette.night.top, t);
    skyUniforms.bottomColor.value.copy(skyPalette.day.bottom).lerp(skyPalette.night.bottom, t);
    scene.fog.color.copy(skyPalette.day.bottom.clone().lerp(skyPalette.night.bottom, t));

    auroraUniforms.uNight.value = t;
    starMat.opacity = t * (0.95 - 0.3 * moonState.illum); // a bright moon washes out the faint stars
  }

  // ===============================================================
  // 4b. E3 — the moon, in tonight's real phase. It always hangs low in the
  //     south-east where the camera naturally looks (not its true spot in
  //     the sky), but its shape — crescent, quarter, gibbous, full — is real.
  // ===============================================================
  var MOON_DIR = new THREE.Vector3(-0.3, 0.2, -0.93).normalize(); // ~12° up, a little east of south
  var MOON_DIST = 140; // kept this far from the camera, like something at infinity
  var moonCanvas = document.createElement("canvas");
  moonCanvas.width = moonCanvas.height = 256;
  var moonTex = new THREE.CanvasTexture(moonCanvas);
  var moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: moonTex, transparent: true, depthWrite: false, fog: false, opacity: 0
  }));
  moonSprite.scale.setScalar(11);
  var moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: meteorGlowTex, color: 0xDCE6FF, transparent: true, depthWrite: false, fog: false,
    blending: THREE.AdditiveBlending, opacity: 0
  }));
  moonHalo.scale.setScalar(42);
  // drawn after the aurora: its additive glow on top would wash out the moon's shape
  moonHalo.renderOrder = 1;
  moonSprite.renderOrder = 2;
  scene.add(moonHalo);
  scene.add(moonSprite);
  var moonState = { phase: -1, illum: 0 };

  function drawMoon(phase) {
    var S = 256, c = S / 2, r = 92;
    var g = moonCanvas.getContext("2d");
    g.clearRect(0, 0, S, S);
    var illum = moonIllumination(phase);
    if (illum < 0.012) { moonTex.needsUpdate = true; return; } // new moon: nothing to see

    // the unlit part, just faintly there behind a crescent (earthshine); nothing at new moon
    var shine = 0.14 * Math.min(1, illum / 0.04) * (1 - illum);
    if (shine > 0.005) {
      g.fillStyle = "rgba(150,168,205," + shine.toFixed(3) + ")";
      g.beginPath(); g.arc(c, c, r, 0, Math.PI * 2); g.fill();
    }
    // lit shape = the sunward half of the disc, minus (crescent) or plus
    // (gibbous) a terminator ellipse; waxing is lit on the right
    var lit = document.createElement("canvas");
    lit.width = lit.height = S;
    var l = lit.getContext("2d");
    var waxing = phase < 0.5, k = Math.cos(2 * Math.PI * phase);
    l.fillStyle = "#F2EFE4";
    l.beginPath();
    if (waxing) l.arc(c, c, r, -Math.PI / 2, Math.PI / 2, false);
    else l.arc(c, c, r, Math.PI / 2, Math.PI * 1.5, false);
    l.closePath();
    l.fill();
    l.globalCompositeOperation = k > 0 ? "destination-out" : "source-over";
    l.beginPath();
    l.ellipse(c, c, Math.max(0.5, r * Math.abs(k)), r, 0, 0, Math.PI * 2);
    l.fill();
    // a few grey maria and a soft darker limb, painted only where it's lit
    l.globalCompositeOperation = "source-atop";
    l.fillStyle = "rgba(140,142,138,0.2)";
    [[-30, -26, 26, 19], [16, -34, 19, 15], [8, 8, 30, 21], [-36, 26, 17, 13], [34, 30, 13, 11]].forEach(function (m) {
      l.beginPath();
      l.ellipse(c + m[0], c + m[1], m[2], m[3], 0.3, 0, Math.PI * 2);
      l.fill();
    });
    var limb = l.createRadialGradient(c, c, r * 0.55, c, c, r);
    limb.addColorStop(0, "rgba(0,0,0,0)");
    limb.addColorStop(1, "rgba(70,74,90,0.2)");
    l.fillStyle = limb;
    l.fillRect(0, 0, S, S);
    g.drawImage(lit, 0, 0);
    moonTex.needsUpdate = true;
  }

  // called by the sky clock about once a second
  function refreshMoon(now) {
    var ph = moonPhase(now.getTime());
    if (Math.abs(ph - moonState.phase) > 0.002) { moonState.phase = ph; drawMoon(ph); } // redraw every ~1.4 h of moon
    moonState.illum = moonIllumination(ph);
    // moonlight: a full moon lights the snow a little more than a thin crescent does
    lightPalette.night.sunI = 0.12 + 0.12 * moonState.illum;
    lightPalette.night.hemiI = 0.24 + 0.08 * moonState.illum;
  }
  function updateMoonLook(nightAmt) {
    moonSprite.position.copy(camera.position).addScaledVector(MOON_DIR, MOON_DIST);
    moonHalo.position.copy(moonSprite.position);
    moonSprite.material.opacity = nightAmt;
    moonHalo.material.opacity = nightAmt * 0.32 * moonState.illum;
  }

  // ===============================================================
  // 5. Snow ground — the northern glacier, from the coast up to LAND_FAR_Z
  // ===============================================================
  function jitterGeometry(geo, amount) {
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * amount);
      pos.setY(i, pos.getY(i) + (Math.random() - 0.5) * amount * 0.5);
      pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * amount);
    }
    geo.computeVertexNormals();
  }

  var groundGeo = makeBandGeometry(-WORLD_HALF_WIDTH, WORLD_HALF_WIDTH, 130, 55, coastlineZ, LAND_FAR_Z);
  var posAttr = groundGeo.attributes.position;
  var colors = [];
  var snowHi = new THREE.Color("#FBFDFF");
  var snowLo = new THREE.Color("#CFE1EE");
  var snowShade = new THREE.Color("#AEC7DC");
  for (var i = 0; i < posAttr.count; i++) {
    var x = posAttr.getX(i), z = posAttr.getZ(i);
    var h = groundHeight(x, z);
    posAttr.setY(i, h);
    var mix = (Math.sin(x * 0.4) * Math.cos(z * 0.4) + 1) * 0.5;
    var c = snowHi.clone().lerp(snowLo, mix * 0.5);
    c.lerp(snowShade, THREE.MathUtils.clamp((0.15 - h) * 0.9, 0, 0.4));
    colors.push(c.r, c.g, c.b);
  }
  groundGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();
  var ground = new THREE.Mesh(
    groundGeo,
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0, side: THREE.DoubleSide })
  );
  ground.receiveShadow = true;
  ground.name = "ground";
  scene.add(ground);

  // jagged pack-ice chunks tracing the coastline, replacing a single ring/torus
  // (a torus can't follow a wiggly coast — scattered chunks read as broken ice edge)
  // sparse and irregular on purpose: a chunk every few meters, not a solid wall
  for (var cx = -(PLAY_HALF_WIDTH + 30); cx <= (PLAY_HALF_WIDTH + 30); cx += 3.2) {
    if (Math.random() < 0.45) continue;
    var jx = cx + (Math.random() - 0.5) * 1.6;
    var jz = coastlineZ(jx) + (Math.random() - 0.5) * 0.6;
    var coastGeo = new THREE.IcosahedronGeometry(0.22 + Math.random() * 0.28, 0);
    jitterGeometry(coastGeo, 0.14);
    var coastChunk = new THREE.Mesh(
      coastGeo,
      new THREE.MeshStandardMaterial({ color: "#EAF3FA", flatShading: true, roughness: 0.85 })
    );
    coastChunk.scale.y = 0.4;
    coastChunk.position.set(jx, 0.04, jz);
    coastChunk.rotation.y = Math.random() * Math.PI;
    coastChunk.castShadow = true;
    scene.add(coastChunk);
  }

  // ===============================================================
  // 5b. Ocean — the southern sea, from the coast down to OCEAN_FAR_Z
  // ===============================================================
  var oceanGeo = makeBandGeometry(-WORLD_HALF_WIDTH, WORLD_HALF_WIDTH, 130, 55, coastlineZ, OCEAN_FAR_Z);
  var oceanUniforms = {
    uTime: { value: 0 },
    uWind: { value: 0.12 },
    uColorDeep: { value: new THREE.Color("#0B2A3B") },
    uColorShallow: { value: new THREE.Color("#1E5B72") },
    uDim: { value: 1.0 }
  };
  var oceanMat = new THREE.ShaderMaterial({
    uniforms: oceanUniforms,
    side: THREE.DoubleSide,
    transparent: true, // only for the edge fade; the open sea itself stays fully opaque
    vertexShader: [
      "uniform float uTime;",
      "uniform float uWind;",
      "varying float vWave;",
      "varying vec2 vXZ;",
      "void main(){",
      "  vec3 pos = position;",
      "  float w = sin(pos.x * 0.18 + uTime * 0.9) * cos(pos.z * 0.16 - uTime * 0.7);",
      "  w += sin(pos.x * 0.4 - uTime * 1.4 + pos.z * 0.3) * 0.4;",
      "  pos.y += w * (0.06 + uWind * 0.22);",
      "  vWave = w;",
      "  vXZ = pos.xz;",
      "  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform vec3 uColorDeep;",
      "uniform vec3 uColorShallow;",
      "uniform float uDim;",
      "varying float vWave;",
      "varying vec2 vXZ;",
      "void main(){",
      "  float d = clamp((-vXZ.y) / 50.0, 0.0, 1.0);",
      "  vec3 col = mix(uColorShallow, uColorDeep, d);",
      "  col += vWave * 0.03;",
      "  float edgeF = smoothstep(" + EDGE_FADE_START.toFixed(1) + ", " + EDGE_FADE_END.toFixed(1) + ", length(vXZ));",
      "  gl_FragColor = vec4(col * uDim, 1.0 - edgeF);",
      "}"
    ].join("\n")
  });
  var ocean = new THREE.Mesh(oceanGeo, oceanMat);
  ocean.position.y = -0.16;
  ocean.name = "ocean";
  // drawn first among transparent things, so ponds/lava/aurora blend over it, not over the sky
  ocean.renderOrder = -2;
  scene.add(ocean);

  function oceanSurfaceY(x, z, elapsed, windStrength) {
    var w = Math.sin(x * 0.18 + elapsed * 0.9) * Math.cos(z * 0.16 - elapsed * 0.7);
    w += Math.sin(x * 0.4 - elapsed * 1.4 + z * 0.3) * 0.4;
    return -0.16 + w * (0.06 + windStrength * 0.22);
  }

  // Unfrozen ponds (geothermal pools stay liquid even in the polar night) —
  // dark, semi-transparent so fish read clearly under the surface. Placed well
  // north of the coast so they can never be confused with the sea.
  var ponds = [];
  function addPond(x, z, r) {
    var baseY = groundHeight(x, z) + 0.01;

    // irregular blob outline instead of a perfect circle: wobble the radius per
    // angle with a couple of sine harmonics plus a little noise, then reuse the
    // same points for both the water fill and the rim so they line up
    var segs = 22;
    var seedA = Math.random() * Math.PI * 2;
    var seedB = Math.random() * Math.PI * 2;
    var pts = [];
    for (var i = 0; i < segs; i++) {
      var ang = (i / segs) * Math.PI * 2;
      var wobble = 1 + 0.24 * Math.sin(ang * 3 + seedA) + 0.13 * Math.sin(ang * 5 + seedB) + (Math.random() - 0.5) * 0.07;
      var rad = r * wobble;
      pts.push({ px: Math.cos(ang) * rad, pz: Math.sin(ang) * rad });
    }

    var shape = new THREE.Shape();
    pts.forEach(function (pt, idx) {
      if (idx === 0) shape.moveTo(pt.px, pt.pz); else shape.lineTo(pt.px, pt.pz);
    });
    shape.closePath();
    var waterGeo = new THREE.ShapeGeometry(shape, 1);
    waterGeo.rotateX(-Math.PI / 2);
    var water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({
      color: "#123244", transparent: true, opacity: 0.82, roughness: 0.25, metalness: 0.15
    }));
    water.position.set(x, baseY, z);
    scene.add(water);

    var rimPoints = pts.map(function (pt) {
      return new THREE.Vector3(x + pt.px, baseY + 0.03, z + pt.pz);
    });
    var rim = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rimPoints, true), segs * 2, 0.1, 6, true),
      new THREE.MeshStandardMaterial({ color: "#EAF3FA", flatShading: true, roughness: 0.9 })
    );
    scene.add(rim);

    ponds.push({ x: x, z: z, r: r, waterY: baseY, water: water, pendingRespawnAt: null });
  }
  addPond(-16, 24, 4.6);
  addPond(14, 15, 3.6);

  function pointInAnyPond(x, z) {
    for (var i = 0; i < ponds.length; i++) {
      var p = ponds[i];
      var dx = x - p.x, dz = z - p.z;
      if (dx * dx + dz * dz < p.r * p.r) return true;
    }
    return false;
  }

  // scattered rocks, staying well north of the coast
  var rocks = []; // E3: a snowy owl likes to perch on one
  for (var r = 0; r < 18; r++) {
    var rp = randomLandPoint(10, PLAY_LAND_FAR_Z - 6);
    var rockR = 0.15 + Math.random() * 0.25;
    var rock = new THREE.Mesh(
      new THREE.IcosahedronGeometry(rockR, 0),
      new THREE.MeshStandardMaterial({ color: "#6B7480", flatShading: true, roughness: 1 })
    );
    rock.position.set(rp.x, groundHeight(rp.x, rp.z) + 0.08, rp.z);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    scene.add(rock);
    rocks.push({ x: rp.x, z: rp.z, top: rock.position.y + rockR * 0.8 });
  }

  // ===============================================================
  // 6. Snow-capped mountain range — a backdrop wall along the far north
  //    edge only. The south stays open sea all the way to the horizon.
  // ===============================================================
  function makeMountain(x, z, h, baseR) {
    var g = new THREE.Group();
    var rock = new THREE.Mesh(
      new THREE.ConeGeometry(baseR, h, 5),
      new THREE.MeshStandardMaterial({ color: "#6E7885", flatShading: true, roughness: 1 })
    );
    rock.position.y = h / 2;
    g.add(rock);
    var cap = new THREE.Mesh(
      new THREE.ConeGeometry(baseR * 0.55, h * 0.42, 5),
      new THREE.MeshStandardMaterial({ color: "#F5FAFE", flatShading: true, roughness: 0.85 })
    );
    cap.position.y = h - (h * 0.42) / 2 + 0.05;
    g.add(cap);
    g.position.set(x, groundHeight(x, z), z);
    g.rotation.y = Math.random() * Math.PI;
    return g;
  }
  var mountains = [];
  function pointInAnyMountain(x, z) {
    for (var i = 0; i < mountains.length; i++) {
      var mt = mountains[i];
      var dx = x - mt.x, dz = z - mt.z;
      if (dx * dx + dz * dz < mt.r * mt.r) return true;
    }
    return false;
  }
  var MOUNTAIN_COUNT = 30;
  for (var m = 0; m < MOUNTAIN_COUNT; m++) {
    var mSpan = PLAY_HALF_WIDTH + 25;
    var mx = -mSpan + (m / (MOUNTAIN_COUNT - 1)) * (mSpan * 2) + (Math.random() - 0.5) * 6;
    var mz = PLAY_LAND_FAR_Z + 4 + Math.random() * 40;
    var mh = 7 + Math.random() * 11;
    var mBaseR = 3.5 + Math.random() * 3.5;
    scene.add(makeMountain(mx, mz, mh, mBaseR));
    mountains.push({ x: mx, z: mz, r: mBaseR, h: mh, rTop: 0 });
  }

  // slope height of a mountain's cone at distance d from its center — used so
  // flying puffins arc high enough to clear a peak instead of passing through it
  function mountainHeightAt(x, z) {
    var best = 0;
    for (var i = 0; i < mountains.length; i++) {
      var mt = mountains[i];
      var d = Math.sqrt((x - mt.x) * (x - mt.x) + (z - mt.z) * (z - mt.z));
      if (d >= mt.r) continue;
      var hh = d <= mt.rTop ? mt.h : mt.h * (mt.r - d) / (mt.r - mt.rTop);
      if (hh > best) best = hh;
    }
    return best;
  }

  // ===============================================================
  // 6a. Dormant volcano — a big lone cone on the glacier. No eruption yet,
  //     but it's registered as a mountain so puffins walk/fly around it
  // ===============================================================
  var VOLCANO = { x: -46, z: 60, r: 15, h: 24, rTop: 3.4 };
  (function buildVolcano() {
    var g = new THREE.Group();
    // radial wobble keyed to angle+height (not random per vertex) so the
    // duplicated seam vertices move together and the cone stays watertight
    function rugged(geo, amt) {
      var pos = geo.attributes.position;
      for (var i = 0; i < pos.count; i++) {
        var vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
        var ang = Math.atan2(vz, vx);
        var f = 1 + amt * (Math.sin(ang * 5 + vy * 0.35) * 0.6 + Math.sin(ang * 11 - vy * 0.8) * 0.4);
        pos.setX(i, vx * f);
        pos.setZ(i, vz * f);
      }
      geo.computeVertexNormals();
    }
    var rockGeo = new THREE.CylinderGeometry(VOLCANO.rTop, VOLCANO.r, VOLCANO.h, 18, 7, true);
    rugged(rockGeo, 0.09);
    // per-face colors: faces on the upper slopes turn to snow along a ragged
    // line, but the last band below the rim stays bare (warm rock near the vent)
    rockGeo = rockGeo.toNonIndexed();
    var rp = rockGeo.attributes.position;
    var faceCols = [];
    var rockC = new THREE.Color("#4A413E"), rockC2 = new THREE.Color("#5A4F4A"), snowC = new THREE.Color("#EEF4F8");
    for (var f = 0; f < rp.count; f += 3) {
      var cx = (rp.getX(f) + rp.getX(f + 1) + rp.getX(f + 2)) / 3;
      var cy = (rp.getY(f) + rp.getY(f + 1) + rp.getY(f + 2)) / 3 + VOLCANO.h / 2;
      var cz = (rp.getZ(f) + rp.getZ(f + 1) + rp.getZ(f + 2)) / 3;
      var ang = Math.atan2(cz, cx);
      var snowLine = VOLCANO.h * 0.52 + Math.sin(ang * 4) * 2.6 + Math.sin(ang * 9 + 1.3) * 1.4;
      var mottled = Math.sin(cx * 1.7 + cz * 2.3 + cy * 0.9) > 0 ? rockC : rockC2;
      var col = (cy > snowLine && cy < VOLCANO.h - 2.2) ? snowC : mottled;
      for (var k = 0; k < 3; k++) faceCols.push(col.r, col.g, col.b);
    }
    rockGeo.setAttribute("color", new THREE.Float32BufferAttribute(faceCols, 3));
    rockGeo.computeVertexNormals();
    var rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
    rock.position.y = VOLCANO.h / 2;
    rock.castShadow = true;
    g.add(rock);

    var crater = new THREE.Mesh(
      new THREE.CylinderGeometry(VOLCANO.rTop * 1.12, VOLCANO.rTop * 0.45, 2.2, 16, 1, true),
      new THREE.MeshStandardMaterial({ color: "#1C1716", flatShading: true, roughness: 1, side: THREE.BackSide })
    );
    crater.position.y = VOLCANO.h - 1.05;
    g.add(crater);
    var craterFloor = new THREE.Mesh(
      new THREE.CircleGeometry(VOLCANO.rTop * 0.46, 16),
      new THREE.MeshStandardMaterial({ color: "#2A1F1C", roughness: 1, emissive: "#FF4A12", emissiveIntensity: 0 })
    );
    craterFloor.rotation.x = -Math.PI / 2;
    craterFloor.position.y = VOLCANO.h - 2.1;
    g.add(craterFloor);

    g.position.set(VOLCANO.x, groundHeight(VOLCANO.x, VOLCANO.z) - 0.2, VOLCANO.z);
    scene.add(g);
    VOLCANO.group = g;
    VOLCANO.craterMat = craterFloor.material;
    VOLCANO.ventY = g.position.y + VOLCANO.h - 1.2;
    // collision radius covers the rugged bulges, not just the nominal base
    mountains.push({ x: VOLCANO.x, z: VOLCANO.z, r: VOLCANO.r * 1.1, h: VOLCANO.h, rTop: VOLCANO.rTop });
  })();

  // ===============================================================
  // 6b. Floating ice — purely decorative, gently bobs on the swell,
  //     scattered through the southern sea
  // ===============================================================
  var floes = [];
  function makeFloe(x, z, scale) {
    var g = new THREE.Group();
    var chunkCount = 2 + Math.floor(Math.random() * 3);
    for (var c = 0; c < chunkCount; c++) {
      var chunkRadius = 0.4 + Math.random() * 0.5;
      var chunkGeo = new THREE.IcosahedronGeometry(chunkRadius, 0);
      jitterGeometry(chunkGeo, chunkRadius * 0.5);
      var chunk = new THREE.Mesh(
        chunkGeo,
        new THREE.MeshStandardMaterial({ color: "#DCEEF5", flatShading: true, roughness: 0.75 })
      );
      chunk.scale.y = 0.32;
      chunk.position.set((Math.random() - 0.5) * 1.5, 0, (Math.random() - 0.5) * 1.5);
      chunk.rotation.y = Math.random() * Math.PI;
      chunk.castShadow = true;
      g.add(chunk);
    }
    g.position.set(x, oceanSurfaceY(x, z, 0, 0.12), z);
    g.scale.setScalar(scale);
    g.userData.bobPhase = Math.random() * Math.PI * 2;
    g.userData.x = x; g.userData.z = z;
    scene.add(g);
    floes.push(g);
  }
  for (var fl = 0; fl < 20; fl++) {
    var flp = randomSeaPoint(PLAY_OCEAN_FAR_Z + 5, -5);
    makeFloe(flp.x, flp.z, 0.6 + Math.random() * 0.9);
  }
  function updateFloes(elapsed, windStrength) {
    for (var i = 0; i < floes.length; i++) {
      var f = floes[i];
      var y = oceanSurfaceY(f.userData.x, f.userData.z, elapsed, windStrength);
      f.position.y = y + Math.sin(elapsed * 1.3 + f.userData.bobPhase) * 0.03;
      f.rotation.z = Math.sin(elapsed * 0.6 + f.userData.bobPhase) * 0.05;
      f.rotation.x = Math.cos(elapsed * 0.5 + f.userData.bobPhase) * 0.04;
    }
  }

  // ===============================================================
  // 7. Falling / wind-blown snow particles
  // ===============================================================
  var SNOW_COUNT = 700;
  var snowGeo = new THREE.BufferGeometry();
  var snowPos = new Float32Array(SNOW_COUNT * 3);
  var snowVel = new Float32Array(SNOW_COUNT);
  for (var sp = 0; sp < SNOW_COUNT; sp++) {
    snowPos[sp * 3] = (Math.random() - 0.5) * WORLD_RADIUS * 2.2;
    snowPos[sp * 3 + 1] = Math.random() * 14;
    snowPos[sp * 3 + 2] = (Math.random() - 0.5) * WORLD_RADIUS * 2.2;
    snowVel[sp] = 0.5 + Math.random() * 0.7;
  }
  snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
  var snowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.09, transparent: true, opacity: 0.85 });
  var snowPoints = new THREE.Points(snowGeo, snowMat);
  scene.add(snowPoints);

  function updateSnow(dt, windStrength) {
    var arr = snowGeo.attributes.position.array;
    for (var i = 0; i < SNOW_COUNT; i++) {
      var iy = i * 3 + 1, ix = i * 3;
      arr[iy] -= snowVel[i] * dt;
      arr[ix] += windStrength * dt * 2.2;
      if (arr[iy] < -0.5) {
        arr[iy] = 12 + Math.random() * 3;
        arr[ix] = (Math.random() - 0.5) * WORLD_RADIUS * 2.2;
        arr[i * 3 + 2] = (Math.random() - 0.5) * WORLD_RADIUS * 2.2;
      }
      if (arr[ix] > WORLD_RADIUS * 1.3) arr[ix] = -WORLD_RADIUS * 1.3;
    }
    snowGeo.attributes.position.needsUpdate = true;
  }

  // ===============================================================
  // 8. Puffins — procedural low-poly builder + AI state machine
  // ===============================================================
  var puffins = [];
  var clickTargets = [];

  function mat(color, extra) {
    var o = { color: color, flatShading: true, roughness: 0.85 };
    if (extra) for (var k in extra) o[k] = extra[k];
    return new THREE.MeshStandardMaterial(o);
  }

  function buildPuffin() {
    var root = new THREE.Group();
    // per-bird size (a growing chick); stays 1 for adults. Kept separate from
    // root, whose scale the backflip animates and then resets to 1.
    var sizer = new THREE.Group();
    var bob = new THREE.Group();
    root.add(sizer);
    sizer.add(bob);

    var black = mat("#1C1D22");
    var white = mat("#F6F4EC");
    var orange = mat("#E8703A");
    var greyBeak = mat("#5B6472");

    var bodyMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.19, 1), black);
    bodyMesh.scale.set(1, 1.15, 1.3);
    bodyMesh.position.y = 0.22;
    bodyMesh.castShadow = true;
    bob.add(bodyMesh);

    var belly = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), white);
    belly.scale.set(0.95, 0.9, 1.1);
    belly.position.set(0, 0.13, 0.05);
    bob.add(belly);

    // head parts hang off a neck pivot so sleeping can bow just the head
    var headPivot = new THREE.Group();
    headPivot.position.set(0, 0.32, 0.1);
    bob.add(headPivot);

    var head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), black);
    head.position.set(0, 0.08, 0.06);
    head.castShadow = true;
    headPivot.add(head);

    var face = new THREE.Mesh(new THREE.IcosahedronGeometry(0.085, 0), white);
    face.scale.set(1, 0.9, 0.6);
    face.position.set(0, 0.08, 0.14);
    headPivot.add(face);

    var beakTop = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.16, 4), orange);
    beakTop.rotation.x = Math.PI / 2;
    beakTop.position.set(0, 0.09, 0.24);
    headPivot.add(beakTop);
    var beakBase = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.06, 4), greyBeak);
    beakBase.rotation.x = Math.PI / 2;
    beakBase.position.set(0, 0.09, 0.16);
    headPivot.add(beakBase);

    var leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.02, 0.13), orange);
    leftFoot.position.set(-0.08, 0.02, 0.06);
    bob.add(leftFoot);
    var rightFoot = leftFoot.clone();
    rightFoot.position.x = 0.08;
    bob.add(rightFoot);

    var tail = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.13, 4), black);
    tail.rotation.x = -Math.PI / 2.4;
    tail.position.set(0, 0.22, -0.24);
    bob.add(tail);

    var wingGeo = new THREE.BoxGeometry(0.03, 0.2, 0.14);
    var leftWingPivot = new THREE.Group();
    leftWingPivot.position.set(-0.14, 0.26, 0.0);
    var leftWing = new THREE.Mesh(wingGeo, black);
    leftWing.position.set(-0.08, -0.02, 0);
    leftWingPivot.add(leftWing);
    bob.add(leftWingPivot);

  function chickLookTarget(g) {

    if (st === 0) return { size: 0.52 + 0.1 * u, plumage: 0, beak: 0, fluff: 1, wing: 0.45, tail: 0, round: 1, headBig: 1 };
    if (st === 1) return { size: 0.72 + 0.2 * u, plumage: 0.3 + 0.6 * u, beak: 0.2 + 0.55 * u, fluff: 0.55 * (1 - u),
      wing: 0.7 + 0.25 * u, tail: 0.4 + 0.5 * u, round: 0.55 * (1 - u), headBig: 0.45 * (1 - u) };

  var CHICK_DOWN = new THREE.Color("#8A919B"), ADULT_BLACK = new THREE.Color("#1C1D22");

  var CHICK_BEAK = new THREE.Color("#4A4F57"), ADULT_ORANGE = new THREE.Color("#E8703A");

  function setupChickModel(p) {
    // a few tufts of down on the head and back, only visible while fluffy
    p.fluff = [];
    [[0, 0.2, 0.05, true], [0.05, 0.17, 0.0, true], [0, 0.36, -0.06, false], [-0.07, 0.33, -0.1, false]].forEach(function (d) {
      var tuft = new THREE.Mesh(new THREE.IcosahedronGeometry(0.045, 0), p.mats.black);
      tuft.position.set(d[0], d[1], d[2]);

  }
  function L(a, b, k) { return a + (b - a) * k; }
  function applyChickLook(p) {
    var lk = p.look, pt = p.parts;
    p.sizeNow = lk.size;
    p.sizer.scale.setScalar(lk.size);
    p.hitbox.scale.setScalar(Math.max(0.7, lk.size)); // stays easy to tap while small
    pt.body.scale.set(L(1, 1.06, lk.round), L(1.15, 1.0, lk.round), L(1.3, 1.04, lk.round));
    pt.body.position.y = L(0.22, 0.2, lk.round);
    pt.belly.scale.set(L(0.95, 1.0, lk.round), L(0.9, 0.85, lk.round), L(1.1, 0.95, lk.round));
    p.headPivot.position.set(0, L(0.32, 0.27, lk.round), L(0.1, 0.08, lk.round));
    pt.head.scale.setScalar(L(1, 1.25, lk.headBig));
    pt.face.scale.set(L(1, 0.8, lk.round), L(0.9, 0.75, lk.round), L(0.6, 0.5, lk.round));
    var bk = L(0.45, 1, lk.beak);
    pt.beakTop.scale.set(bk, L(0.55, 1, lk.beak), bk);
    pt.beakBase.scale.setScalar(L(0.6, 1, lk.beak));
    pt.tail.scale.setScalar(Math.max(0.001, lk.tail));
    pt.leftWing.scale.set(1, lk.wing, L(0.8, 1, lk.wing));
    pt.rightWing.scale.set(1, lk.wing, L(0.8, 1, lk.wing));
    p.mats.black.color.copy(CHICK_DOWN).lerp(ADULT_BLACK, lk.plumage);
    p.mats.white.color.copy(CHICK_BELLY).lerp(ADULT_WHITE, lk.plumage);
    p.mats.orange.color.copy(CHICK_BEAK).lerp(ADULT_ORANGE, lk.beak);

  // eases toward the target look, so growth and stage changes animate in place
  function updateChickLook(p, dt) {

    for (var key in target) {

    }
    if (moved) applyChickLook(p);
  }

  function spawnChickEntity(sp) {
    chickEntity = spawnPuffin(sp.x, sp.z, chickRec);
    chickEntity.idleT = idleFor(chickEntity, 0.6, 1.4);
    return chickEntity;
  }
  if (chickRec) {
    var chickSpawn = findChickSpawnPoint() || { x: 0, z: 16 };
    spawnChickEntity(chickSpawn);
  }

  function pickWanderTarget(p) {
    if (youth(p) < 2) {
      // little legs: short strolls, and the whole path has to be safe ground
      var from = new THREE.Vector2(p.root.position.x, p.root.position.z);
      var reach = youth(p) === 0 ? 1.8 : 2.6;
      for (var tries = 0; tries < 10; tries++) {
        var a = Math.random() * Math.PI * 2, r = 0.6 + Math.random() * reach;
        // drift back toward home rather than wandering off forever
        var cx = p.home.x + Math.cos(a) * r, cz = p.home.y + Math.sin(a) * r;
        var to = new THREE.Vector2(cx, cz);
        if (isSafeGround(cx, cz, 0.3) && isSafeRoute(from, to, 0)) { p.target.copy(to); return; }
      }
      p.target.copy(from); // nowhere safe to go: stay put
      return;
    }
    for (var attempt = 0; attempt < 6; attempt++) {
      var angle = Math.random() * Math.PI * 2;
      var dist = 0.8 + Math.random() * WANDER_RADIUS * persona(p).wander;
      var nx = THREE.MathUtils.clamp(p.home.x + Math.cos(angle) * dist, -PLAY_HALF_WIDTH + 3, PLAY_HALF_WIDTH - 3);
      var nz = THREE.MathUtils.clamp(p.home.y + Math.sin(angle) * dist, 5, PLAY_LAND_FAR_Z - 3);
      if (nz < coastlineZ(nx) + 5) continue;
      if (pointInAnyMountain(nx, nz) || pointInLavaZone(nx, nz)) continue;
      if (!pointInAnyPond(nx, nz)) { p.target.set(nx, nz); return; }
    }
    p.target.copy(p.home);
  }


  function faceToward(root, dx, dz, dt, turnSpeed) {
    var targetAngle = Math.atan2(dx, dz);
    var da = targetAngle - root.rotation.y;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    root.rotation.y += da * Math.min(1, dt * turnSpeed);
  }

  // Steers a walking puffin around any mountain whose base footprint the
  // straight-line path toward its target would otherwise clip. Classic local
  // obstacle-avoidance: project the mountain onto the path, and if it's close
  // enough (both ahead and near the line) push sideways away from its center.
  function steerAroundMountains(px, pz, dir) {
    var steer = null;
    for (var i = 0; i < mountains.length; i++) {
      var mt = mountains[i];
      var toX = mt.x - px, toZ = mt.z - pz;
      var proj = toX * dir.x + toZ * dir.y;
      var avoidR = mt.r + 1.8;
      var lookAhead = 7 + mt.r;
      if (proj > -avoidR && proj < lookAhead) {
        var perpX = toX - dir.x * proj, perpZ = toZ - dir.y * proj;
        var perpDist = Math.sqrt(perpX * perpX + perpZ * perpZ);
        if (perpDist < avoidR) {
          var pushX, pushZ;
          if (perpDist > 0.001) { pushX = -perpX / perpDist; pushZ = -perpZ / perpDist; }
          else { pushX = -dir.y; pushZ = dir.x; }
          var strength = (avoidR - perpDist) / avoidR;
          if (!steer) steer = { x: 0, y: 0 };
          steer.x += pushX * strength;
          steer.y += pushZ * strength;
        }
      }
    }
    return steer;
  }

  // hard safety net on top of steering: if a step would end inside a mountain's
  // footprint, slide the puffin back out to the rim along the radial direction
  function pushOutOfMountains(pos) {
    for (var i = 0; i < mountains.length; i++) {
      var mt = mountains[i];
      var dx = pos.x - mt.x, dz = pos.y - mt.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      if (d < mt.r) {
        if (d < 0.0001) { dx = 1; dz = 0; d = 1; }
        pos.x = mt.x + dx / d * (mt.r + 0.02);
        pos.y = mt.z + dz / d * (mt.r + 0.02);
      }
    }
    return pos;
  }

  // lowest arc peak that keeps a straight-line flight above every cone it
  // crosses: arc height at fraction t is peak*sin(pi*t), so check samples
  function flightArcFor(from, to) {
    var peak = 2.4;
    for (var s = 1; s < 20; s++) {
      var t = s / 20;
      var need = mountainHeightAt(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t);
      if (need > 0) peak = Math.max(peak, (need + 0.8) / Math.sin(Math.PI * t));
    }
    return Math.min(peak, 45);
  }

  // juveniles can only manage short hops, and further as their flying improves
  function juvenileFlightRange(p) { return 4 + 6 * flightSkill(p); }

  // returns false if this bird can't safely get to the food (it then stays put)
  function sendToFood(p, food, offset) {
    var targetPos = offset ? new THREE.Vector2(food.pos.x + offset.x, food.pos.y + offset.y) : food.pos.clone();
    if (pointInAnyMountain(targetPos.x, targetPos.y)) targetPos = food.pos.clone();
    var pos2 = new THREE.Vector2(p.root.position.x, p.root.position.z);
    var dist = pos2.distanceTo(targetPos);
    var yth = youth(p);
    if (yth < 2) {
      if (!isSafeRoute(pos2, targetPos, 0)) return false;
      p.visiting = false; p.watchT = 0;
      p.foodRef = food;
      p.target.copy(targetPos);
      var skill = flightSkill(p);
      if (yth === 1 && dist > 2.5 && dist <= juvenileFlightRange(p) && flightArcFor(pos2, targetPos) <= 2.5) {
        // a low, short juvenile flight — never the adults' long arcs
        p.flightStart.copy(pos2);
        p.flightT = 0;
        p.flightArc = 0.7 + 0.6 * skill;
        p.flightDuration = dist / (2.6 + 2.2 * skill);
        p.state = "fly";
      } else {
        p.state = "walk"; // chicks always waddle
      }
      return true;
    }
    p.visiting = false; p.watchT = 0;
    p.foodRef = food;
    p.target.copy(targetPos);
    if (dist < FLY_DISTANCE_THRESHOLD) {
      p.state = "walk";
    } else {
      p.flightStart.copy(pos2);
      p.flightT = 0;
      p.flightArc = flightArcFor(pos2, targetPos);
      p.flightDuration = Math.max(0.9, dist / FLY_SPEED) * (1 + (p.flightArc - 2.4) / 30);
      p.state = "fly";

  }

  // called whenever a puffin actually eats the food it was heading for.
  // Affinity (E1) and growth (E2) are judged separately, each with its own cooldown.
  function puffinAte(p, food) {
    if (!food || !food.byPlayer) return;
    if (p.rec.adopted) grantAffinity(p, 3);
    if (p.isChick) {
      if (addJournal(p.rec, "firstFood", Date.now())) { saveRoster(); refreshCompanionUI(); }
      grantGrowth(p, "feed");
    }
  }

  // timid puffins relax as they get to know you (adopted + affinity)
  function timidRelax(p) { return p.rec.adopted ? Math.min(1, p.rec.affinity / 70) : 0; }

  // a brief flinch/shiver overlay; only timid puffins show it, and less as they relax

  }

  var REACT_DUR = { shy: 1.5, look: 1.3, flap: 1.5, joy: 2.0 };

    p.reactT = 0;

    p.react = { type: type, dur: REACT_DUR[type] * (amp > 1 ? 1.15 : 1), amp: amp };
  }
  function finishReact(p) {
    p.react = null;
    p.root.position.y = groundHeight(p.root.position.x, p.root.position.z);
    if (p.reactReturn === "walk") p.state = "walk";
    else { p.state = "idle"; p.idleT = idleFor(p, 0.8, 1.6); }
  }

  // petting never interrupts flying, fleeing (incl. a young bird scurrying
  // away on foot), a backflip or growth practice
  function canPet(p) {
    return p.state === "idle" || (p.state === "walk" && !p.fleeing) || p.state === "sleep";
  }
  function petPuffin(p) {
    if (!canPet(p)) return false;
    var stage = Math.max(0, stageOf(p.rec));
    if (p.state === "sleep") {

    } else if (stage === 1) {

    } else {
      startReact(p, "look");
    }
    if (p.rec.adopted) grantAffinity(p, 2);
    return true;
  }

  // ---- E2 growth practice ----
  function canPractice(p) {
    return p.isChick && youth(p) < 2 && !p.practice &&
      (p.state === "idle" || (p.state === "walk" && !p.foodRef && !p.fleeing));
  }
  // A short, low practice flight: a few steps of run-up, then air, then a
  // landing — only if the whole line is over safe ground and clear of
  // mountains, water, the lava zone and other puffins' feet.
  function findFlightRoute(p) {
    var skill = flightSkill(p);
    var start = new THREE.Vector2(p.root.position.x, p.root.position.z);
    var span = 3 + 5 * skill;
    var offsets = [0, 0.5, -0.5, 1.0, -1.0, 1.6, -1.6, 2.3, -2.3, Math.PI];
    for (var i = 0; i < offsets.length; i++) {
      var a = p.root.rotation.y + offsets[i];
      var dx = Math.sin(a), dz = Math.cos(a);
      var runEnd = new THREE.Vector2(start.x + dx * 0.6, start.y + dz * 0.6);
      var land = new THREE.Vector2(start.x + dx * (0.6 + span), start.y + dz * (0.6 + span));
      if (!isSafeGround(land.x, land.y, 0.8) || !isSafeRoute(start, land, 0.3)) continue;
      if (flightArcFor(runEnd, land) > 2.5) continue;
      var blocked = puffins.some(function (q) {
        return q !== p && Math.hypot(q.root.position.x - land.x, q.root.position.z - land.y) < 0.7;
      });
      if (!blocked) return { start: start, runEnd: runEnd, land: land, span: 0.6 + span, skill: skill };

  // returns "ok", "busy" or "noRoute" (the last two cost nothing)
  function startPractice(p) {

    if (youth(p) === 0) {
      p.practice = { type: "flutter", t: 0, dur: 3.0 };
    } else {
      var route = findFlightRoute(p);
      if (!route) return "noRoute";
      var air = route.span / (2.4 + 2.0 * route.skill);
      p.practice = {
        type: "learnfly", t: 0, start: route.start, runEnd: route.runEnd, land: route.land,
        runDur: 0.55, airDur: air, landDur: 0.55, dur: 0.55 + air + 0.55,
        arc: 0.5 + 0.9 * route.skill, wobble: 0.3 * (1 - route.skill) + 0.05,
        heading: Math.atan2(route.land.x - route.start.x, route.land.y - route.start.y)
      };
    }
    p.visiting = false;
    p.watchT = 0;

  // only a practice that ran to the end gets here; interrupted ones just vanish
  function completePractice(p) {
    var pr = p.practice;

    p.practiceRoll = 0;
    p.root.position.y = groundHeight(p.root.position.x, p.root.position.z);
    p.state = "idle";
    p.idleT = idleFor(p, 1.0, 1.5);
    var rec = p.rec, now = Date.now();
    if (pr.type === "flutter") {
      rec.flutterCount++;
    } else {
      rec.flightCount++;
      if (addJournal(rec, "firstFlight", now)) showToast(t("toast.firstFlight", { name: displayName(rec) }), 2600);
    }
    saveRoster(); // practice counts + journal are kept even while growth is on cooldown
    grantGrowth(p, "practice");
    if (rec.adopted) grantAffinity(p, GROWTH.PRACTICE_AFFINITY);
    refreshCompanionUI();
